# yaml-language-server: $schema=schema/project.schema.json
# The factory's own project description (docs/language.md, Project). Read from the default branch by `factory project sync`; keys: docs/project.md.
apiVersion: factory/v2
name: software-factory
host: macmini # the host its alerts sit on (config/infra.json), so its Kuma and HyperDX alerts join that host's incident
deploy:
  mode: make # `make deploy` on the mini, `make verify` proves it
  targets:
    - { name: mini, host: mini, verify: make verify } # host mini: the weekly hygiene pass judges the repo by the mini's run rules
  hold: 0m
ship:
  - { via: pr }
signals:
  github: { author: jkrumm, since: 2026-11-07T06:30:00Z, checks: true } # the owner's new issues come in; anyone else's need the label
leads: 12 # NL32: the merge window serialises merges (~10 an hour), so a lead waits up to ~1.2 h of the lock's 90 min at 12; more would time it out
slots: { run: 30m } # `make check-fast` runs in one slot; a rerun of one heavy suite to reproduce a CI failure fits
budgets: { fast: 5m, peak: 4GiB, fail: 30% } # the throughput loop (docs/architecture.md): a day over one of these is a signal on this repo
checks: { fast: make check-fast, full: make check, ci: true } # leads run fast locally; CI runs the full gate sharded (.github/workflows/ci.yml)
# docs-check is pure bun over the tree: it passes in the step image, so it may run off the mini. check-fast stays home: it
# writes oxfmt's fixes into the worktree. unit runs the unit tests, each of which starts its own Postgres from the image's server
# binaries (docs/architecture.md "Steps off the mini")
steps:
  docs-check: { make: docs-check, remote: true, bun: 1.4.2 } # the mini's bun: package.json names no packageManager
  unit: { make: test-unit, remote: true, bun: 1.4.2 } # make test-unit directly (inside check-fast it is the lead's own slot and stays home)
  check-fast: { make: check-fast }
hygiene: { probes: [{ name: readme, target: docs-check }] } # the README's counts and lists against the code (scripts/readme-check.ts)
