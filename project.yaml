# The factory's own project description (docs/language.md, Project). Read from the default branch by `factory project sync`.
apiVersion: factory/v2
name: software-factory
host: macmini # the host its alerts sit on (config/infra.json), so its Kuma and HyperDX alerts join that host's incident
deploy:
  mode: make # `make deploy` on the mini, `make verify` proves it
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 0m
  migrations: [apps/server/migrations/]
ship:
  - { paths: ['**'], via: pr }
signals:
  github: { author: jkrumm, since: 2026-11-07T06:30:00Z, checks: true } # the owner's new issues come in; anyone else's need the label
leads: 5
slots: { run: 60m } # the whole `make check` runs in one slot
