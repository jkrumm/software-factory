        2. Beside it: the p90 of the same set; the oldest open Issue with its age and its reason word; the number closed dropped or cancelled.
        3. Beside it: list dollars per done Issue by the seat of its first lead, and the strong tier's share of lead dollars (56 % in the week to 26 November).
