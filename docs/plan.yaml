  - key: ren-rollback-across-migration
    kind: bug
    lane: spine
    prio: 90
    seat: { role: lead, moveUp: true }
    title: "A release boots on a schema that is ahead of it, so make rollback works across a migration"
    facts:
      why: |-
        A rollback breaks on a migration, and so does the branch proof every spine row of this plan asks for. The server's start and the deploy's dry check throw "migration <name> is applied but missing from this release" whenever the database holds a migration the release lacks (applyPending in apps/server/src/adapters/postgres/migrate.ts). make rollback to a release from before a migration starts a server that cannot boot: scripts/deploy.sh tries three times, removes the plist, and the factory is down. 13 rows of this plan carry a migration, and no rollback across one has ever been run (check M4, 27 November 2026; 471 deploys in the log since 12 November). The owner: "it's a bit hard maybe to change yourself with yourself".
      what: |-
        apps/server/src/adapters/postgres/migrate.ts (applyPending), apps/server/src/migrate-check.ts, main.ts (the boot's "migrated:" line), scripts/deploy.sh (rollback, migration_dry_check), apps/server/test/postgres.test.ts, tests/scenarios/boot.test.ts, docs/operations.md "Deploy". This row adds no migration.
      change: |-
        1. applyPending accepts an applied name the release lacks when it sorts after the release's newest file: the schema is ahead. An applied migration whose text was edited, and a missing one that sorts before the release's newest, are refused as today.
        2. Boot logs one line naming the migrations the schema is ahead by; migrate-check prints the same line.
        3. make rollback runs the previous release's migrate-check before it stops anything and prints that line; DRY_RUN=1 shows it too.
        4. docs/operations.md says: a release boots on a schema that is ahead; a migration that drops or renames ships one release after the code that stopped using it; a branch with a pending migration is never proven with FACTORY_REF.
      decided: |-
        Names ahead are accepted, never undone: no down migrations (this plan's, after check M4).
        The safety is the rule the repo has: expand, then contract. Old code reads a schema that only has more in it (AGENTS.md).
        A pending migration that sorts before an applied one is still refused, so a branch cannot slip a number in behind the ledger.
      not: |-
        How a migration is written or numbered. The drill's rollback case: ren-drill-weekly.
      acceptance: |-
        A migrate test: a ledger with one name past the release's newest applies nothing and reports that name; an edited migration and a missing earlier one still throw.
        A scenario test: a server boots and answers GET /health against a schema one migration ahead.
        DRY_RUN=1 make rollback on the mini prints its plan and the line of migrations ahead, or that there is none.
        docs/operations.md holds the three sentences; make check-fast passes.
        The branch was proven on the mini with FACTORY_REF=<branch> make deploy and make verify before the merge; the branch holds no pending migration.
