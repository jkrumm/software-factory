  - key: queue-free-behind-wait
    kind: feature
    seat: {tier: opus, effort: high}
    prio: 20
    title: "What does not need the owner's answer goes ahead: a Replan frees it, and Needs you shows what each answer holds"
    facts:
      why: |-
        On the morning of 2026-11-21 one owner gate had waited three days with 26 plan rows behind it, three of them directly: an analytics change to the old version, a development host and a database on the server. The planning pass files a Replan for a stalled head only when the head waits on a timer. A head that waits on the owner holds everything drawn behind it, whether it needs his answer or not, and Needs you does not say what an answer would release.
      what: |-
        apps/server/src/app/planning-pass.ts (the stalled trigger, about line 287); domains/planning/replan.ts (StalledHead, the playbook, the replan block); the rule that settles a Replan that only frees (domains/checkpoints/spec-screen.ts, or where ask-spec-is-a-plan moved it); the needs read and the Needs you cards in apps/console; docs/plan.md; docs/language.md (Owner gate).
      change: |-
        (1) The stalled trigger also fires for a head that has waited on the owner for two hours (a gate's Spec, an open Decision, an Errand) with open Issues or unfiled plan rows behind it; once per head and wait. (2) The playbook for that case: for each direct dependent, one line on whether it needs the answer or the head's output. A dependent is freed when its work stands under every answer the owner can give and a revert undoes it; everything else stays held. (3) The replan block gains free: the plan rows whose only change is a removed after. A Replan that only removes edges, on Issues or in plan rows, is settled by rule and applied at once; the plan edit ships through the repo's ship path. (4) Every item in Needs you shows what it holds, Issues and plan rows, and the list sorts by that within a kind; the head's card lists what went ahead without the answer. (5) docs/plan.md and the Owner gate entry say it: a gate holds what needs its answer, and a Replan may free the rest.
      acceptance: |-
        Tests: the trigger fires once for a head held on the owner with a plan row behind it; a block that only frees is settled by rule; a block that changes a row otherwise still waits. On the live factory after the deploy, the next head held on the owner with dependents gets a Replan within one pass, and its card shows its count. make check passes.
      evidence: |-
        factory read chain --format json on 2026-11-21 08:15 UTC: 92 plan rows waiting; 26 of them rooted at one owner gate held since 2026-11-18. REPLAN_TRIGGERS in apps/server/src/domains/planning/replan.ts: owner, stalled (a timed wait with Issues behind it), held.
