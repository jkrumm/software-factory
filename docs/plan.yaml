  - key: mat-ship-proves-itself
    seat: { tier: opus, effort: high }
    prio: 30
    title: "Ship without a typed sha: the server derives the merged commits, and the cut is the Issue's"
    facts:
      why: |-
        The gate refused 101 ships in the 7 days to 2026-11-20 (1,545 Issues filed). About 70 were a sha typed wrong, taken from an earlier attempt or not merged yet ("commit X is not on origin/master: merge it first"), and 13 were "older than this attempt". One Issue retried the same sha four times with one digit wrong. The server already holds the Issue's branch and the cut it was started from, so the lead types what the server knows. The retro counts 49.8 lead-hours a week behind refused ships.
      what: |-
        apps/server/src/app/quality-ship.ts and quality-checkout.ts, apps/server/src/adapters/quality/git.ts (the commit checks, about lines 185 to 220), the ship operation in packages/contract and the generated CLI verb, the lines of apps/server/src/domains/leads/brief.ts that tell a lead to pass commits, and their tests and scenarios.
      change: |-
        `factory issue ship <id>` with no commits derives them: the commits of the Issue's branch since the Issue's cut that are on the origin default branch. Commits passed by hand stay accepted. The cut is the Issue's (the first attempt's), so a later attempt can ship what an earlier attempt landed. When nothing of the branch is on the default branch, the refusal names the one command to run next. The brief stops asking for a sha.
      acceptance: |-
        Scenarios: a ship with no commits after a merge is accepted and stores the merged commits as evidence; attempt 2 ships work attempt 1 landed; a ship of an unmerged branch is refused and the message names the next command; a ship with commits passed by hand behaves as today. make check-fast passes. The brief's ship order names no sha.
      evidence: |-
        docs/research/2026-11-maturation/audit-agents.md, findings F1 and F2.
      cycle: |-
        Maturation cycle 2026-11-20 (docs/research/2026-11-maturation/README.md): remove mechanisms, add none. The finding named under evidence was taken at commit 8fa0a18c: read it first and re-check each file and line before acting. Behaviour outside the stated change stays as it is.
