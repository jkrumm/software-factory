           a. Killed server: kill -9 under a working lead; the Issue closes done (scratch.sh does it today).
           b. Hung pass: the stall switch holds a pass; the watchdog ends the process; /health is ok again.
           c. Lost program: the scratch lead's program is killed in its terminal; the factory starts the session again; the Issue closes done.
           d. Deploy killed half way: the scratch project's make deploy sleeps under factory deploy-lock and is killed; the next deploy takes the lock.
           e. Rollback: compare the migration files of the live and the previous release first; when they are the same, make rollback twice, back and forward, and /health reports each sha.
        2. The stall switch: a file drill/stall-<loop> in the data directory holds that loop's next pass while it exists; boot removes it.
        3. A failed case files factory signal file --from agent:software-factory --repo software-factory --title "Drill: <case> failed" with its scrubbed timeline.
        4. A weekly jobrun schedule: a plist template in deploy/ and make drill-setup.
      decided: |-
        A failed drill files a bug and pages nobody (this plan's, under the owner's direction of 27 November 2026); each kill marks itself deliberate as kill-server.sh does.
        No core restart: it would end every session on the host; case c does the same to one terminal (this plan).
        During a deploy or over its load gate the drill prints "skipped" and exits 0 (this plan).
        Case e skips, naming the migrations, when the two releases differ by one: the live swap is drilled only where it cannot meet a drop (this plan's, after check M4).
      not: |-
        The registry entry and the install on the mini: ren-drill-weekly-schedule.
      acceptance: |-
        make drill on the mini prints five lines; each is GREEN, or factory signal list shows "Drill: <case> failed" for it.
        A test: the stall file holds a pass and boot removes it.
        DRY_RUN=1 make drill touches nothing; docs/operations.md lists the cases; make check-fast passes.

