      what: |-
        apps/server/src/domains/errands/errand.ts HOST_CLASSES (from line 97) for a lead's raise. apps/server/src/domains/errands/triage.ts for factory errand request, the path of ask-human: its refusals (refuseKeyless, refuseOffMacbook, refuseBotCheck) each name the way to take, and verbFor (line 167) lets the factory run three fixed MacBook verbs itself. In dotfiles: scripts/macbook-file.sh ls, get and put carry a file under a read root; the help of ask-human.sh lists the classes and their forms. The server knows neither the read roots nor the grants: the MacBook's gate does, and says so when it refuses.
