      what: |-
        apps/server/src/app/loops/runner.ts (State, view), main.ts (readHealth), read/lines.ts (the loop line), packages/contract/src/loops.ts (LoopView) and health.ts (HealthLoop), and their tests. judgeTick and the heartbeat stay as they are.
