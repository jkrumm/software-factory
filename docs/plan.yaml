  - key: judge-agw-case
    repo: agent-workflows
    kind: feature
    seat: {tier: opus, effort: high}
    prio: 20
    after: [ask-agw-judge-context]
    after_needs: shipped
    title: "Every factory judge reads the case file; the Judge works with tools; five judges move up a tier"
    facts:
      why: |-
        The Spec screen failed because it judged a document from a headline: one call, the cheapest seat, no tools, no facts. The audit under evidence shows the other judges are built the same way. The factory never calls a model: every judgment is one of these workflows, so their answers decide what the owner reads, what waits and what is folded away.
      what: |-
        packages/capabilities/src/capabilities/factory-{ask,steward,queue,triage,screen,errand,errand-needed}.ts and their workflows under packages/host/src/workflows; packages/routes/src/table/factory.ts; factory-fix-classes (capability, workflow, route, cases); docs/factory-input.md. Read AGENTS.md first.
      change: |-
        (1) One shared optional input, case, on the seven judges: issue (the filed text and facts), ownerNotes, repo (the project.yaml summary and the head of AGENTS.md), open (the repo's open Issues: id, title, summary, state, edges), plan (the plan rows of the Issue and its neighbours), precedents (earlier answers of this judge in this repo, each with its outcome: stood, overruled, raised again, unknown) and, for the steward, pane (the last lines of the lead's terminal). Every text is untrusted data, fenced as today. The caps are generous (a case of 60,000 characters is accepted) and an over-long case is refused, never cut. Each prompt says what each part is for; a request with no case is answered as today. (2) factory-ask becomes an agent step with read, glob and grep in the checkout the request names, on the HARD tier, with no turn limit and no wall-clock limit (the idle watchdog is the one stop). Before it says owner it looks: the plan, AGENTS.md, the design guide, the code the question is about. An answer cites the file and line, or the quote, it rests on. The plan stub and worthAsking leave its input. (3) steward, triage, screen, errand and queue move to the HARD tier; errand-needed stays, because its guard makes the cheap direction the safe one. Each route comment states the calls a week at today's volume. Run each judge's existing eval once after the change and put the score in the pull request; no new suite is built. (4) factory-screen takes final, and on a final look it promotes or dismisses. (5) factory-fix-classes, its route and its cases are deleted. (6) factory-ask gains a third verdict, back, given only when the request allows it (sendBack true): the question returns to the lead with one note of at most 600 characters, and the Judge picks no option. Two cases. Yours: the question is outside the owner's classes, or the repo settles most of it; the note says so and cites what the Judge found (file and line), and the lead decides, because it knows the code best. Not ready: the question is the owner's, but he could not answer it in ten seconds; the note names what is missing (the exhibit, what an option leads to, what changes). answer stays for a question that a quote of the owner or the plan settles outright, owner for one that is his and ready. The owner on 2026-11-21: the Judge should "rather work together with the lead" than decide on its own.
      acceptance: |-
        A test per judge: a request with a case puts each part into the prompt, fenced; a request without one answers as before. factory-ask on a fixture checkout answers a question its plan settles and cites the file. rg finds no fix-classes outside dated docs. Tests for back: one for each case, and none is given when sendBack is false. make check passes.
      evidence: |-
        Audit of 2026-11-21 over agent-workflows and software-factory, each line checked in the code: of the nine factory judgment workflows eight are one call with no tools, and seven run on the EASY tier. The Judge (factory-ask) is on HARD but is sent the Issue's title only (apps/server/src/domains/checkpoints/decision.ts, judgeInputOf), and its plan input is the empty string while its prompt says to answer from plan excerpts (packages/capabilities/src/capabilities/factory-ask.ts, lines 139 and 223). The steward is sent 12 history lines of 160 characters where its schema takes 40 of 500. Triage judges "restates an open Issue" from candidate titles alone. factory-screen is sent final: true on its last look and has no such field. An Errand on the mini carries no host. factory-fix-classes has no caller since software-factory pull request 601. No judge is sent the repo's AGENTS.md or project.yaml, and only the hygiene judge and the queue's added edges are checked afterwards against what happened.
