        Settled with the owner in the planning session of 2026-11-21, from his words that day (spelling corrected): "What is yours is a Decision ... sufficient context, if needed, needs to be there and well presented, with a good concept of how to visualize and express that change sharply." "Sometimes a Spec stops the queue for a reason, which is ok, but other items could go already with some reordering, that don't actually depend on the lead and the Spec; some requeueing would make sense." On the Spec screen (one call, cheapest seat, no tools, no facts): "This was severely badly designed. Those agw flows should be very enabled and have all at hand to do good decisions." This row owes no Spec and no Decision: its choices are made below. Build it.
