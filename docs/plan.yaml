    kind: feature
    prio: 40
    title: "A factory server that is alive but does not answer is restarted from outside, with a backoff and never during a deploy"
    facts:
      why: |-
        The software factory's server gets a watchdog inside the process (its row ren-hung-server-restarts), a timer. A timer cannot fire when the event loop is blocked: GET /health then does not answer, the process lives, and launchd, which acts only on an exit, does nothing. The one program outside that reads the heartbeat is scripts/devhost-health-check.sh: every 300 seconds factory_health_detail asks GET /health three times and pushes "factory not answering" to a monitor. Then a person restarts the server.
