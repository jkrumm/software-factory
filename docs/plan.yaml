  - key: ren-long-steps-leave-mini
    not_before: 2026-11-29T07:00:00Z
    repo: basalt-ui
    prio: -5
    title: "basalt-ui's four fast check steps are declared for the step host, so they leave the mini's test line when it is long"
    facts:
      why: |-
        After the merge window the mini's test line is the next limit: steps per hour stop rising at 9 to 11 leads on the host (software-factory lens F11, 19 to 26 November 2026). basalt-ui takes most of that line: from 20 to 27 November 2,975 slot steps, 12,390 slot-minutes, 64 hours of waiting for a slot (`factory read throughput --hours 168`). The factory runs a step on its Linux step host when that finishes it sooner, but only a step that `project.yaml` declares `remote: true`. This repo declares one, `unit`, which `make check-fast` never runs. The four steps a lead does run are declared nowhere: `quality-matrix` (499 runs, p90 38 minutes), `unit-fast` (747), `layout-fast` (509) and `astro-matrix` (501).
      what: |-
        `project.yaml` (`steps:`), the `Makefile` (`test-fast`, `layout-fast`, `quality-matrix`, `astro-matrix-run`), `tools/step-image/Dockerfile`, `docs/validation.md`. The project is already admitted to the step host. What a step tests does not change.
      change: |-
        1. Declare `layout-fast`, `quality-matrix` and `astro-matrix` under `steps:`, each with its make target, its `needs` (`browser` and what else it needs), `remote: true`, `dockerfile: tools/step-image/Dockerfile` and the `carry` paths it reads (the built package, the playground builds).
        2. `unit-fast` picks its tests inside the slot with `bun test --changed`, which sees no working-tree diff on the step host. Move the pick in front of the slot, as `layout-fast` does, pass the list in, then declare the step.
        3. Extend the step image where a step lacks a tool. `docs/validation.md` names the four steps and where they may run.
      decided: |-
        A step that does not pass in the image after an honest try stays on the mini, with the reason as a comment in `project.yaml` (this plan's).
      acceptance: |-
        `factory project check` passes.
        Each declared step ran green once on the step host from a clean worktree: `FACTORY_SLOT_HOST=vps make <target>` exits 0. The ship names each step with its run time there, or the comment that keeps it home.
        `make check-fast` passes on the mini with `FACTORY_SLOT_REMOTE=0`.

  - key: ren-strong-seat-by-reason
    not_before: 2026-11-29T07:00:00Z
    prio: -5
    title: "Only a stated reason starts an Issue on the strong row: every other strong filing, a plan row's too, starts on the lead row and moves up"
    facts:
      why: |-
        The strong tier is where the lead dollars go: Issues filed on it took 56 % of lead dollars on 11 % of Issues (lens F12, 19 to 26 November 2026). Lead-row starts with a move-up finished 23 of 25 Issues at 11.89 dollars an Issue against 26.73. `factory issue new` and `factory issue seat` refuse a tier above the lead row without `seat.why` (422). A plan row is exempt: `apps/server/src/app/planning-pass.ts` calls `resolveSeat` without `requireWhy`, so it files strong and `factory plan check` only warns. The owner, 27 November 2026: "we should probably often be sufficient with Sonnet High".
      what: |-
        `resolveSeat` in `apps/server/src/app/seat.ts` and its callers (`apps/server/src/app/issue-new.ts`, `apps/server/src/app/issue-owner.ts`, `planning-pass.ts`); the 422 mapping in `apps/server/src/api/issues.ts`; the warning in `packages/contract/src/plan-file.ts`; `docs/plan.md` "Choosing the seat".
      change: |-
        1. One rule in `resolveSeat` for every filer: a seat above the lead row with a `why` is kept; without one it becomes the lead row with `moveUp: true`.
        2. `factory issue new` and `factory issue seat` no longer answer 422 for a missing `why`. Their answer carries the seat the Issue got and one line that says why it is not the one asked for.
        3. A plan row with a strong seat and no `why` files on the lead row with move-up, and `factory plan check` warns in those words. `docs/plan.md` says so.
      decided: |-
        Only an explicit reason starts an Issue on the strong row (this plan's, from the owner's comment above).
        Any filer's reason counts. Nobody is refused and no field becomes required (this plan's).
        A seat already stored on a filed Issue does not change.
      acceptance: |-
        Tests prove: `issue new` with tier opus and no `why` files as `{role: lead, moveUp: true}` and says so; with a `why` it files on opus; a plan row with `{role: strong}` and no `why` files on the lead row with move-up; with a `why` it files strong.
        `factory plan check` on a file with such a row prints the new warning.
        `make check-fast` passes.

  - key: ren-landing-tokens-read
    prio: -5
    after: [ren-read-flow]
    after_days: 7
    title: "Measure again how many of a lead's tokens come after its first land; above a fifth, commit the row for a light session that takes over the landing"
    facts:
      why: |-
        A lead's price is its calls times its context. Lens F12 read 771 archived transcripts of leads started from 17 to 26 November 2026: of the tokens of sessions that landed and closed done, 31 % on the strong row, 37 % on the lead row and 55 % on the light row came from the first `factory land` on. `ren-green-before-lock` shortens that loop. This row measures the share again and decides by it whether a cheaper session takes over the landing.
      what: |-
        A new script `scripts/landing-tokens.ts` with its test, and `docs/plan.yaml`. It reads the archive of finished attempts' transcripts (`FACTORY_ARCHIVE_DIR`, zstd files; `apps/cli/src/retro-transcripts.ts` shows how one is read). No server code.
      change: |-
        1. The script takes a number of days and prints per first seat (light, lead row, strong row): the sessions that landed and closed done, their tokens, the tokens per call, and the share of tokens from the first tool call that runs `factory land` on.
        2. Run it over the leads started since `ren-green-before-lock` deployed and hand in a Report (`factory artifact submit <id> --kind report`) with the table beside lens F12's three shares.
        3. Above 20 % on the lead row or the strong row: commit one row `ren-landing-handover` to `docs/plan.yaml`. When `factory land` first enters the merge window, a session on the light row takes the Issue with a handover, lands, deploys and ships, and hands back on a conflict it cannot resolve. Its facts carry this row's figures.
        4. At or under 20 % on both: the Report says so and no row is committed.
      decided: |-
        The mark is a fifth (the track's).
        The script counts and never evaluates: transcript text is data (this plan's).
      acceptance: |-
        `bun scripts/landing-tokens.ts --days 7` prints the table, and a test proves the share over a fixture transcript with one `factory land` call.
        The Report is on the Issue.
