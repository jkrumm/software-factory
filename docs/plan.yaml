        3. Backoff: the next restart waits 15 minutes, then 30, 60, at most 120; an hour of answered runs resets it.
        4. Once the factory answers, file one signal on software-factory (factory signal file --from agent:dotfiles) titled "The server did not answer and was restarted from outside", with the times.
        5. The docs name this one exception to "nothing auto-heals".
      decided: |-
        In the host's heartbeat, not a new job or the plist: it reads the heartbeat already, and launchd has no liveness probe (this plan's).
        Only silence restarts, never an answer with ok false: a restart cures no error (this plan's).
        SIGKILL of the checked pid: a blocked event loop handles no SIGTERM (this plan's).
