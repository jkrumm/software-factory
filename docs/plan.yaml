    facts:
      why: |-
        apps/server/src/read/friction.ts (about lines 110 to 132) keys a refused ship and a refused event on the raw reason. 72 of 90 ship-refusal keys in the week to 2026-11-20 embed a sha, so "commit X is not on origin/master: merge it first" is about 50 keys of count 1. The text is cut to 80 characters after the SQL GROUP BY, so seven keys appear two to four times and never add up. The friction loop's refusal rule (apps/server/src/domains/loops/friction.ts, THRESHOLDS.refusal: at least 3 and 10 % of closed Issues) therefore cannot fire: 101 refused ships a week are invisible to it.
      what: |-
