  - key: subs-policy-lab
    after: [subs-read-model]
    after_needs: shipped
    seat: {tier: opus, effort: high}
    title: "Subscriptions: measure the load, score picking policies against it, promote one only if it wins"
    facts:
      why: |-
        Program "subscriptions" (owner decision 2026-11-19): handling N Claude Code subscriptions (the factory's word: accounts) moves from dotfiles into the factory, as a part of the product another user can run. Before the program the registry (dotfiles config/claude-accounts.json), the quota cache and the picker (dotfiles scripts/lib/claude-accounts.ts, the claude-account CLI, rule v1.9; design and rationale in dotfiles docs/claude-accounts.md) lived in dotfiles, and the factory server, agent-workflows, usage-tracker and tinycast-extensions call that CLI or read that file. Order: port with no behaviour change (subs-package), switch both machines with a rollback (subs-switch-dotfiles), the new model (subs-model-v2), one read model (subs-read-model), then the server, the Console, the policy lab and the displays, and the old code deleted a week after everything runs on the package.
        Three rules hold in every row. One definition: what state an account is in, whether it takes work and why, is computed in packages/accounts only; nothing else keeps limits of its own (tinycast-extensions has a copy that says 85/90 where the picker uses 90/95/98/100, the factory server has its own limits and weekly pace). Additive: whoever reads today's registry fields, claude-account usage --json, picks.jsonl or the cache files keeps working unchanged. Independent: the claude-account CLI works with the factory server down and on a machine without a software-factory checkout (the MacBook has none), so packages/accounts imports nothing from apps/server and needs no database.
        Opus: novel optimisation logic. The rule grew by hand (v1.1 to v1.9), each step from one bad week. The goal the owner set: every account at about 100 % at its weekly reset, nothing blocked. The problem is perishable capacity behind a rate limit: capacity that expires first should be used first, but an account absorbs only what its 5h window lets through, so it must start early enough to fill. v1.9 approximates this with one fixed horizon for every account (earliest reset first inside 72 h), although an Ultra with two capacity units needs longer than a Max. The simulation ported in subs-package (claude-account-sim.test.ts) showed 24 h leaving the default account at 88-92 % at its reset where 72 h gives 99-100 %, 120 h and 168 h moving more sessions, and the factory's former roomLeft order leaving every account at 75-98 %; but its load model (session length, burn rate, the 5h share of a week, the day curve) is guessed.
      what: |-
        packages/accounts (policies, the simulate and compare verbs, a shadow log), its docs and tests.
      change: |-
        Make a policy a named pure function over the same snapshot; v1.9 is the first, and the registry's policy: names the live one (default v1.9). Measure the simulation's load model from the package's sample log and picks.jsonl (session length, weekly points per 5h point for each plan, the demand curve over the day and the week, the lane mix) and keep the measured numbers in a file the simulation reads, with the date range they came from.
        A candidate "laxity": an account is due when the hours to its reset are no more than the hours it needs to fill its remainder at the rate it can absorb (its 5h window's measured share of a week, the measured demand); the due account with the least slack goes first, and with none due the v1.9 order holds. The lead may add other candidates.
        claude-account simulate [--policy <name>] [--demand <x>] [--accounts <n>] runs the three-week simulation. claude-account compare [--weeks <n>] prints, per policy, the simulated quota used at reset, the blocked picks and the moved sessions over demand 0.85 to 1.2 and over 1, 2, 3, 5 and 8 accounts of mixed plans, beside the live result from the reset ledger for the weeks each policy was live. A shadow log in a file of its own (picks.jsonl keeps its shape) records, for a live pick, what another policy would have picked when it differs; compare reports it as a disagreement rate only, because a pick that was not made has no outcome.
      acceptance: |-
        simulate and compare run on the mini on the measured load model. The report in the Issue's evidence states, per candidate, whether it beats v1.9: more capacity-weighted quota used at reset over the demand range, with no more moved sessions and nothing blocked at demand 1.0 or below. A candidate that wins becomes the live policy by one registry line, with tests that assert the win; if none wins, v1.9 stays live, the finding goes into the package docs, and the row is done. No test is tuned to make a candidate pass. make check-fast passes and CI is green.
