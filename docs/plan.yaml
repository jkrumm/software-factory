    facts:
      why: "The owner, 2026-11-09, expected the factory to move his queue while he is away: check what is still needed and settle what it can, so he returns to what only he can answer. Today a checkpoint only leaves Needs you when its lead withdraws it or its Issue closes."
      change: "A checkpoint open longer than a threshold (6 h, a setting) is checked once more, deterministic first: a Decision or Errand whose Issue moved past it (closed, its wait ended, a newer Decision on the same question) is withdrawn with the reason; the rest goes to the Judge again with the events since it was raised, which may settle it, and what the Judge settles is told to the lead. Nothing is checked twice without a new event."
