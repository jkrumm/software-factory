  - key: ren-lead-token-always
    prio: 40
    lane: spine
    after: [ren-lead-routes-open]
    after_needs: shipped
    seat: { role: lead, moveUp: true }
    title: "Inside a session the factory started, the CLI always calls as that session, so the record says who acted"
    facts:
      why: |-
        A lead's call can be recorded as the owner's. The CLI falls back to the owner's token whenever FACTORY_TOKEN is empty, and the Console's listener puts the owner's token on every write it forwards. Three of 800 scanned lead sessions called as the owner after a 403 (lens F09, 26 November 2026). So the owner's acts per 100 shipped Issues cannot tell him from a lead.
      what: |-
        apps/cli/src/credentials.ts: tokenFromEnv and credentialOf (from line 40). With no token in the environment, on a host with a deployed release, the CLI resolves the FACTORY_TOKEN ref of the release's .env.tpl through secrets-run; the template also holds FACTORY_AGENT_TOKEN. apps/server/src/adapters/hc/terminals.ts lines 560-563 give a lead FACTORY_SESSION and the agent token as FACTORY_TOKEN. apps/server/src/api/console.ts apiForward (lines 80-101) drops the client's authorization and sets the owner's; the tailnet reaches that loopback listener through a proxy, a local process directly (docs/operations.md "The Console listener").
      change: |-
        1. credentialOf: when FACTORY_SESSION is set and no token is in the environment, resolve the FACTORY_AGENT_TOKEN ref of the same template, never the owner's. authHint says so.
        2. The Console listener: a write that did not come through the tailnet's proxy is forwarded with the caller's own authorization and gets no owner token. Reads stay as they are.
      decided: |-
        Not a wall: every route a lead needs is open to its own token since row ren-lead-routes-open. This row makes the record true. This plan's, from the direction page of 27 November 2026.
        No token per lead and no scope: decided against.
      acceptance: |-
        Unit tests of credentials.ts: FACTORY_SESSION set and FACTORY_TOKEN empty resolves the agent ref; neither set resolves the owner ref as today.
        A test of console.ts: a write with no proxy header keeps its own bearer; one with it gets the owner's.
        The branch holds no pending migration and was proven on the mini with FACTORY_REF=<branch> make deploy and make verify before the merge.
        After the deploy factory read flow --format json showed one other Issue that started and one that shipped.
        A lead that started on the previous release finishes on this one without a hand, and after make rollback a lead started on this release finishes on the previous one: a test or one stated reason proves each direction.
        In a lead session on the mini, FACTORY_TOKEN= factory queue order is refused with 403 as the agent caller.
        make check-fast passes.

