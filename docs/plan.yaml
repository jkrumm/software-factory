  # The throughput loop: measure, account, control, improve (Spec artifact_01a1d638-1830-73c7-b2f3-e439055e6d39, verdict
  # with notes 2026-11-13; research docs/research/2026-11-13-throughput-tooling.md). Every control row runs in shadow
  # first: it records what it would have decided beside the live rule for 48 hours and switches on only if swapouts and
  # pressure did not rise in the minutes it would have admitted more. The boot grace (issue 1039) and the swap gates stay
  # the floor. Moving tenants off the mini (the Colima VMs, the company services) is the vps plan of issue 1050, which the
  # owner asked to combine with this one: its figures come from tp-measure, its moves are not rows here.
  - key: tp-measure
    issue: 1044
  - key: tp-account
    after: [tp-measure]
    title: "Throughput: where a lead's hours and a project's slot-minutes go"
    facts:
      why: "Of about 260 lead-hours in two days (2026-11-11 to 13) 35 h were model turns, 68 h test steps and 22 h slot waits; the rest (CI, the merge lock, the owner, idle) is recorded nowhere, so nothing can say which wait to cut."
      what: "apps/server/src/read/throughput.ts and its contract model (the `lead` and `project` parts beside `host`), the merge lock (apps/cli/src/deploy-lock.ts) and a table for its wait and hold, the self-watch's CI reads for a CI-run ledger per head, docs/architecture.md."
      change: "Split each Issue's lead wall time into in a turn, in a step, waiting for a slot, for CI, for the merge lock, for the owner, and idle, from lead_hook_events, step_costs, a new merge-lock record (wait and hold per lead, written by `factory merge-lock`) and a CI-run ledger (duration, queue, result per head). Add a project scorecard to `factory read throughput`: slot-minutes per closed Issue, check p50 and p90 per tier, failed-run minutes, peak memory, slot wait, CI duration, the local to CI split, and the lead time split."
      acceptance: "For every Issue closed in a seeded week the split sums to the lead's wall time within 2% (a test restates it in SQL); `factory read throughput` carries the scorecard per project; make check-fast passes and CI is green."
  - key: tp-leads
    after: [tp-measure]
    title: "Throughput: the load ceiling in multiples of the cores and a process-count cap, shadow first"
    facts:
      why: "Seats sat idle with work queued (249 idle seat-hours in two days), while the fixed load ceiling of 120 never bound: load reached 201 and 213 before the 2026-11-13 panic and 273 after boot. Issue 1040, which the Spec folded into this row, shipped first: lead admission against free memory alone (#291) and the footprint per lead (#293); what is left is the ceiling and the process storm."
      what: "apps/server/src/domains/capacity/admission.ts and host.ts, apps/server/src/app/capacity-admit.ts, a shadow-decision table, the capacity settings, docs/architecture.md. The admission floor of issue 1039 (boot grace) stays."
      change: "Express the load ceiling in multiples of the cores (default: no new lead above 3x) and add a cap on the host's process count (from host_samples.processes), because the panic class is process storms, not memory. Measure each repo's lead cost at rest from the lead class rows of host_class_samples (a lead with no step running) and show it beside the learned peak. Run both rules in shadow for 48 hours: store per admission minute what the shadow rule would have decided beside the live one; switch on only if swapouts and pressure level did not rise in the minutes it would have admitted more."
      acceptance: "The shadow table shows 48 hours of decisions; after switch-on, idle seat-hours with work queued are under 10 a day and swapouts per day are not above the 7 days before (both from `factory read capacity-loop`); make check-fast passes and CI is green."
  - key: tp-slots
    after: [tp-measure]
    title: "Throughput: the test-slot count follows memory pressure, steps run at background priority, shadow first"
    facts:
      why: "The two test slots were about 78% busy with a slot wait p90 of 7 minutes while the load average sat at 6 to 10 on 12 cores; one fixed count is either too tight on a quiet host or too loose under pressure."
      what: "apps/server/src/domains/capacity/slots.ts, the slot grant, apps/cli/src/slot.ts (the run's priority), a shadow-decision table, docs/architecture.md."
      change: "Move the slot count between 1 and a ceiling, AIMD on the pressure signals tp-measure records: one more after 5 quiet minutes at pressure level 1 with a waiter in line, halved at level 2 or when swap grows, one at level 4; no extra slot above 2x the cores in load. The learned-peak fit of a step stays. Run steps under `taskpolicy -b` once a test on this host shows interactive sessions stay responsive under a full test load. Shadow 48 hours first, as tp-leads."
      acceptance: "After switch-on, the slot wait p90 is under 2 minutes over 7 days and no minute is at pressure level 4 (`factory read throughput`, `factory read capacity-loop`); the taskpolicy test is in the Report; make check-fast passes and CI is green."
  - key: tp-tests
    after: [tp-measure]
    title: "Throughput: test results per run, flake rate and failed-run minutes"
    facts:
      why: "Failed local runs cost slot-minutes (software-factory's full check failed in 63% of runs before check tiers), and a flaky test cannot be told from a broken one without results per test."
      what: "`factory slot run` (apps/cli/src/slot.ts) collects JUnit files the step names, a new results table, apps/server/src/read/throughput.ts, docs/architecture.md."
      change: "Have bun test, Playwright and pytest write JUnit in the repos' check targets (a convention in docs/plan.md's check tiers), let `factory slot run` post the JUnit of its run beside the step cost, and store one row per test result (OTel `cicd.*` names where they exist). Derive the flake rate (the same commit with both results) and the minutes lost to failed runs per project into the scorecard."
      acceptance: "A seeded flaky test is named in `factory read throughput` within a day of its first flake; the failed-run minutes per project match step_costs in a test; make check-fast passes and CI is green."
  - key: tp-alerts
    after: [tp-measure]
    title: "Throughput: runaway daemons, swap growth and process storms raise door signals"
    facts:
      why: "The 2026-11-13 panic was preceded by hours of load above 200; reports of the same watchdog panic name daemons (fseventsd) growing by many GiB. Nothing tells the owner while it happens."
      what: "The host loop (apps/server/src/app/loops/host.ts), host_process_samples and host_samples, the signal intake, docs/architecture.md."
      change: "Raise one signal (deterministic fingerprint per process or condition) when a process grows by more than 1 GiB in an hour (from host_process_samples), swap grows for 15 minutes in a row, or the process count passes the cap of tp-leads. A signal repeats only after the condition cleared."
      acceptance: "A drill process growing by 1 GiB an hour raises exactly one signal; a seeded swap rise of 15 minutes raises one; make check-fast passes and CI is green."
  - key: tp-loop
    after: [tp-account, tp-tests]
    title: "Throughput: a daily ranking of what costs most, one improvement Issue per project, and a ledger that checks the after"
    facts:
      why: "Measured costs only pay off when someone acts on the largest one and checks it moved; the retro does this weekly and by hand."
      what: "A new daily loop (apps/server/src/app/loops/), the retro's markers (apps/server/src/domains/loops/retro.ts: `kpi= before= direction=` plus `after=`), project.yaml `budgets:`, docs/architecture.md, docs/plan.md."
      change: "Each day rank findings by cost without a model: slot-minutes of failed runs, slot-minutes per closed Issue against the project's 14-day median, a step's peak memory, a class over its budget, a process growing without bound, queued hours by reason. Keep one open improvement Issue per project, filed with the measured before, the target and the query. Three days after its ship the ledger reads the after and reopens the finding if it did not move. `budgets: { fast: 90s, peak: 2GiB, fail: 10% }` in project.yaml makes a breach a signal the day it happens."
      acceptance: "The first three improvement Issues carry their before and, three days after their ship, their after; a seeded budget breach raises one signal the same day; make check-fast passes and CI is green."
  - key: tp-console
    after: [tp-account, tp-loop]
    title: "Throughput: a Console page and the retro's section"
    facts:
      why: "The owner reads the factory on the Console; throughput needs one page that shows where the host's memory and the leads' hours go, against budgets."
      what: "apps/console (a new route under apps/console/DESIGN.md's rules), the retro bundle (apps/server/src/read/retro.ts), tests/e2e."
      change: "Build the page from `factory read throughput`: footprint by class against the class budgets, the top tenants and processes, the pressure and swap timeline, the lead time split and the project scorecard, and the open improvement Issues with their before and after. Add the same figures to the weekly retro's bundle. Load the dataviz skill first; screenshots at 1800x1200 dark and light."
      acceptance: "Playwright on seeded rows; screenshots in evidence; the owner's verdict on the page is recorded."

  # Subscriptions program (2026-11-19, revised the same day after a check against the code, the readers and the usage
  # endpoint): N Claude Code accounts as a part of the factory. Port, switch with a rollback, then the model, one read
  # model, the server, the Console, a policy lab, the displays, and the old code deleted. Rows file themselves in order.
  - key: subs-package
    title: "Subscriptions: port the dotfiles account picker into packages/accounts with the same CLI contract"
    facts:
      why: |-
        Program "subscriptions" (owner decision 2026-11-19): handling N Claude Code subscriptions (the factory's word: accounts) moves from dotfiles into the factory, as a part of the product another user can run. Before the program the registry (dotfiles config/claude-accounts.json), the quota cache and the picker (dotfiles scripts/lib/claude-accounts.ts, the claude-account CLI, rule v1.9; design and rationale in dotfiles docs/claude-accounts.md) lived in dotfiles, and the factory server, agent-workflows, usage-tracker and tinycast-extensions call that CLI or read that file. Order: port with no behaviour change (subs-package), switch both machines with a rollback (subs-switch-dotfiles), the new model (subs-model-v2), one read model (subs-read-model), then the server, the Console, the policy lab and the displays, and the old code deleted a week after everything runs on the package.
        Three rules hold in every row. One definition: what state an account is in, whether it takes work and why, is computed in packages/accounts only; nothing else keeps limits of its own (tinycast-extensions has a copy that says 85/90 where the picker uses 90/95/98/100, the factory server has its own limits and weekly pace). Additive: whoever reads today's registry fields, claude-account usage --json, picks.jsonl or the cache files keeps working unchanged. Independent: the claude-account CLI works with the factory server down and on a machine without a software-factory checkout (the MacBook has none), so packages/accounts imports nothing from apps/server and needs no database.
        This row is the drop-in: the same behaviour in the factory repo, installed beside the live CLI.
      what: |-
        A new packages/accounts (library + the claude-account CLI entry) and its docs. Sources to port: ~/SourceRoot/dotfiles/scripts/lib/claude-accounts.ts, scripts/claude-account.ts, scripts/claude-account.test.ts, scripts/claude-account-sim.test.ts, docs/claude-accounts.md. Nothing in dotfiles changes in this row; the live ~/.local/bin/claude-account stays the dotfiles one.
      change: |-
        Port the code and its tests as they are (rule v1.9, Fable and drain mode). Keep every verb, flag, stdout and --json shape, exit code and file location: registry from $CLAUDE_ACCOUNTS_REGISTRY, else ~/.config/claude-accounts/registry.json when it exists, else ~/SourceRoot/dotfiles/config/claude-accounts.json; cache ~/.cache/claude-accounts/; picks ~/.local/share/claude-accounts/picks.jsonl. Split the pure policy (pick and rank over a snapshot of registry, samples, marks and time) from the adapters behind ports: Keychain token read, the OAuth usage GET, claude auth status, the statusline record, the peer import, the relogin ask. The owner's adapters stay the defaults in this row and no registry key is added (subs-onboard makes them configurable). Add claude-account --version naming the package and its commit. No runtime dependency outside the package, so one file can be built from it: the deploy builds that file into the release directory beside the CLI entry (the MacBook has no checkout and pulls its client pieces from the mini's live release) and installs ~/.local/bin/claude-account-next on the mini.
      acceptance: |-
        Golden files match the package CLI in stdout and exit code: a script in the package records them from the dotfiles CLI on a fixture registry, cache and clock for every verb and lane, and the test compares against the committed files (CI has no dotfiles checkout). Every ported test and the simulation pass in the package. On the mini, claude-account-next rank --lane bulk --json and usage --json equal the live claude-account output apart from timestamps. The built single file answers --version and usage --json when run from an empty directory. make check-fast passes and CI is green.
  - key: subs-switch-dotfiles
    repo: dotfiles
    after: [subs-package]
    after_needs: shipped
    title: "Switch the live claude-account to the factory accounts package, with a one-command rollback"
    facts:
      why: |-
        Program "subscriptions" (owner decision 2026-11-19): handling N Claude Code subscriptions (the factory's word: accounts) moves from dotfiles into the factory, as a part of the product another user can run. Before the program the registry (dotfiles config/claude-accounts.json), the quota cache and the picker (dotfiles scripts/lib/claude-accounts.ts, the claude-account CLI, rule v1.9; design and rationale in dotfiles docs/claude-accounts.md) lived in dotfiles, and the factory server, agent-workflows, usage-tracker and tinycast-extensions call that CLI or read that file. Order: port with no behaviour change (subs-package), switch both machines with a rollback (subs-switch-dotfiles), the new model (subs-model-v2), one read model (subs-read-model), then the server, the Console, the policy lab and the displays, and the old code deleted a week after everything runs on the package.
        Three rules hold in every row. One definition: what state an account is in, whether it takes work and why, is computed in packages/accounts only; nothing else keeps limits of its own (tinycast-extensions has a copy that says 85/90 where the picker uses 90/95/98/100, the factory server has its own limits and weekly pace). Additive: whoever reads today's registry fields, claude-account usage --json, picks.jsonl or the cache files keeps working unchanged. Independent: the claude-account CLI works with the factory server down and on a machine without a software-factory checkout (the MacBook has none), so packages/accounts imports nothing from apps/server and needs no database.
        This row moves both machines onto the package; the dotfiles code stays in place as the rollback until subs-cleanup-dotfiles.
      what: |-
        make setup and the link for ~/.local/bin/claude-account, the MacBook's copy of the built file, docs/symlink-map.md, docs/claude-accounts.md, docs/architecture.md, a doctor row. Not scripts/lib/claude-accounts.ts or its tests (subs-cleanup-dotfiles deletes them).
      change: |-
        On the mini, link ~/.local/bin/claude-account to the CLI entry in the live factory release (under ~/.software-factory/current, as ~/.local/bin/factory is linked). The MacBook has no software-factory checkout: bring the single built file level with the mini's live release the way scripts/herdr-glance-sync.sh does for the jk-glance mod (through the core, compare, swap only when the new copy differs and runs), at the same moments that sync runs; read scripts/AGENTS.md §Deploy gate pins before adding a verb to the MacBook's gate. Link config/claude-accounts.json to ~/.config/claude-accounts/registry.json on both machines, so the package reads the registry without a dotfiles path. The dotfiles callers (relogin, keepalive LaunchAgent, heartbeat, statusline record, launchers) keep calling the same verbs. One make target points the link back at scripts/claude-account.ts (the rollback) and one forward. A doctor row compares claude-account --version on both machines and warns when they differ.
      acceptance: |-
        make check passes. Before the switch, save on each machine the output of claude-account usage --json, rank --json for every lane, fable, account and health --json; after it they are equal apart from timestamps, and c, cf, rd work, the statusline segment, make doctor and the next keepalive run behave as before. Both machines print the same claude-account --version, naming the package. usage-tracker's quota collector and the agent-workflows fleet quota still read their data. The rollback target was run, verified with --version, and undone.
  - key: subs-model-v2
    after: [subs-switch-dotfiles]
    after_needs: shipped
    checkpoint: spec
    seat: {tier: opus, effort: high}
    title: "Subscriptions: per-account modes with an expiry, overrides that reach both machines, and the Fable allowance"
    facts:
      why: |-
        Program "subscriptions" (owner decision 2026-11-19): handling N Claude Code subscriptions (the factory's word: accounts) moves from dotfiles into the factory, as a part of the product another user can run. Before the program the registry (dotfiles config/claude-accounts.json), the quota cache and the picker (dotfiles scripts/lib/claude-accounts.ts, the claude-account CLI, rule v1.9; design and rationale in dotfiles docs/claude-accounts.md) lived in dotfiles, and the factory server, agent-workflows, usage-tracker and tinycast-extensions call that CLI or read that file. Order: port with no behaviour change (subs-package), switch both machines with a rollback (subs-switch-dotfiles), the new model (subs-model-v2), one read model (subs-read-model), then the server, the Console, the policy lab and the displays, and the old code deleted a week after everything runs on the package.
        Three rules hold in every row. One definition: what state an account is in, whether it takes work and why, is computed in packages/accounts only; nothing else keeps limits of its own (tinycast-extensions has a copy that says 85/90 where the picker uses 90/95/98/100, the factory server has its own limits and weekly pace). Additive: whoever reads today's registry fields, claude-account usage --json, picks.jsonl or the cache files keeps working unchanged. Independent: the claude-account CLI works with the factory server down and on a machine without a software-factory checkout (the MacBook has none), so packages/accounts imports nothing from apps/server and needs no database.
        Opus: a data model the server, the Console and other repos build on. Today Fable mode and drain are top-level special cases of the registry (fable: <id>, drain: [<id>]). A drain never ends by itself: the owner has to remember to remove it, and after his manual reset it would drain the fresh week. Every toggle is a git commit, and a toggle on one machine is unknown on the other until that commit is pulled. Fable mode holds the whole account back as the last resort for every other pick, although the usage endpoint says Fable can use only half of it.
        Verified on 2026-11-19 against GET https://api.anthropic.com/api/oauth/usage for all three accounts: beside five_hour and seven_day the body has limits[], each {kind: session | weekly_all | weekly_scoped, group, percent, severity, resets_at, scope, is_active}. The weekly_scoped one has scope.model.display_name "Fable" (scope.model.id is null) and the same resets_at as weekly_all. weekly_scoped_shares[] gives {limit_index, used_percent_of_weekly, allowance_percent_of_weekly: 50}; on the default account that day weekly_all was 15, the scoped percent 6 and used_percent_of_weekly 3. So Fable use counts against the weekly limit, is capped at 50 weekly points per account and resets with the week: there is no separate Fable window. The body also has pace and indicator keys (null that day) and a severity per limit. The statusline feed (rate_limits in dotfiles scripts/statusline.sh, the source of most samples) carries only the session and weekly percentages, never the scoped limit.
      what: |-
        packages/accounts (registry schema, modes, the override state file, samples, the rule's use of modes, the verbs mode and fable), its docs and tests. The Spec also fixes the shape of claude-account status --json, which subs-read-model builds.
      change: |-
        Registry v2 is v1 plus optional fields, and a v1 file keeps its meaning: fable: <id> reads as mode reserve for fable on that account, drain: [<id>] as mode drain, and the platform block is untouched (it stays the agent-workflows gateway's).
        Modes, one per account. normal. drain: first in every lane while its 5h window is cool, weekly ceiling 100, as today. reserve with for: <model>: the launcher for that model lands there, as cf does today. paused: takes no new work but is still sampled and its login still checked (enabled: false stays what it is, an account that is not set up and is neither sampled nor checked).
        What reserve holds back is the unused part of the model's allowance, not the account: other work is admitted on a reserve account while weekly_all plus the unused allowance (allowance_percent_of_weekly minus used_percent_of_weekly) stays under the weekly ceiling, and inside that budget the account takes its normal place in the rule. With several reserve accounts for one model the model's launcher takes the open one with the most unused allowance; with none open it falls back as claude-account fable does today. The Spec asks the owner one question about the end of the week and names the default: hold the unused allowance to the reset, or release it in the final 24 hours (default: release, so the account can still reach 100 %).
        Every mode can carry an expiry: until reset, until an ISO time, or none. Reset means the account's weekly window was observed to reset (its weekly resets_at moved forward by more than a day, or its weekly percent fell by 50 points or more between two samples), so the owner's manual reset ends a drain as a scheduled one does. A drain set without an expiry defaults to until reset.
        Runtime overrides: claude-account mode <id> <mode> [--for <model>] [--until reset|<iso>] [--why <text>] and claude-account mode <id> --clear write a state file (atomic) and one audit line each; claude-account mode with no id prints every account's effective mode with its source (override or registry), expiry and why. The effective mode is the live override, else the registry. An override reaches the other machine: usage --json gains an additive mode field per account with the time it was set, the existing peer import adopts the newer one per account, and a clear travels as a tombstone.
        Samples keep limits[] and weekly_scoped_shares[] as the endpoint gives them, with an age per limit, beside the fields readers use today. The scoped limit comes only from the endpoint GET, so the refresh fetches it for an account in reserve mode when its scoped sample is older than a bound the Spec names, inside the endpoint budget dotfiles docs/claude-accounts.md states. A registry with a version this build does not know is "registry unreadable" (exit 4: the launcher falls back to the default account), never a crash.
      acceptance: |-
        The Spec lists the v2 registry schema, the state file, the mode verb, the additive fields of usage --json, the status --json shape, every case where a v1 registry now gives another pick (the reserve budget), and the end-of-week question with its default. Golden parity: a v1 registry without overrides gives the same pick and rank output as before for every lane outside those listed cases. Tests: a drain override until reset is gone after an observed reset, including one before the scheduled time; a reserve account takes other work while its budget holds and refuses it once weekly_all plus the unused allowance reaches the ceiling; an override written on one machine is adopted by the other through the peer import and a clear removes it there; property tests over 1 to 8 accounts with random plans, reset times and modes (a paused or closed account is never picked, a drain account is first while cool, the same snapshot gives the same order). On the mini, claude-account mode <id> drain --until reset shows in rank at once and on the MacBook after its next refresh. make check-fast passes and CI is green.
  - key: subs-read-model
