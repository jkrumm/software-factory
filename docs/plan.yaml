# The factory's own plan (docs/architecture.md, the planning loop files its next Issue). Rows with `issue` adopt an Issue filed by hand;
# the others are filed by the server when their `after` rows are closed and their conditions hold.
# The file holds open rows only (docs/plan.md "Pruning"): a row whose Issue closed is removed, unless an open or waiting row
# still names it in `after`; that one stays as a stub, `key` and `issue`, until the row that waits for it is done.
# A taste checkpoint (a row that asks the owner for a verdict on how something looks or feels) waits until there is enough
# built to judge, never after the first screens: Console v0 went to him too thin ("everything is missing", 2026-11-08) and
# the review moved to console-review. Place one `after` the last row that makes the thing whole, and let its `facts` name
# what is still missing.
version: 1
rows:
  # Subscriptions program (2026-11-19, revised the same day after a check against the code, the readers and the usage
  # endpoint): N Claude Code accounts as a part of the factory. Port, switch with a rollback, then the model, one read
  # model, the server, the Console, a policy lab, the displays, and the old code deleted. Rows file themselves in order.
  - key: subs-server
    issue: 2415
  - key: subs-switch-agw
    issue: 2406
  - key: subs-displays-dotfiles
    issue: 2417
  - key: subs-cleanup-dotfiles
    repo: dotfiles
    kind: chore
    after: [subs-switch-agw, subs-server, subs-displays-dotfiles]
    after_needs: shipped
    after_days: 7
    title: "Delete the dotfiles copy of the account picker after a week on the package"
    facts:
      why: |-
        Program "subscriptions" (owner decision 2026-11-19): handling N Claude Code subscriptions (the factory's word: accounts) moves from dotfiles into the factory, as a part of the product another user can run. Before the program the registry (dotfiles config/claude-accounts.json), the quota cache and the picker (dotfiles scripts/lib/claude-accounts.ts, the claude-account CLI, rule v1.9; design and rationale in dotfiles docs/claude-accounts.md) lived in dotfiles, and the factory server, agent-workflows, usage-tracker and tinycast-extensions call that CLI or read that file. Order: port with no behaviour change (subs-package), switch both machines with a rollback (subs-switch-dotfiles), the new model (subs-model-v2), one read model (subs-read-model), then the server, the Console, the policy lab and the displays, and the old code deleted a week after everything runs on the package.
        Three rules hold in every row. One definition: what state an account is in, whether it takes work and why, is computed in packages/accounts only; nothing else keeps limits of its own (tinycast-extensions has a copy that says 85/90 where the picker uses 90/95/98/100, the factory server has its own limits and weekly pace). Additive: whoever reads today's registry fields, claude-account usage --json, picks.jsonl or the cache files keeps working unchanged. Independent: the claude-account CLI works with the factory server down and on a machine without a software-factory checkout (the MacBook has none), so packages/accounts imports nothing from apps/server and needs no database.
        After a week on the package with no rollback, the dotfiles copy is dead code that drifts.
      what: |-
        scripts/lib/claude-accounts.ts, scripts/claude-account.ts, scripts/claude-account.test.ts, scripts/claude-account-sim.test.ts, the rollback target, docs/claude-accounts.md, docs/architecture.md, rules/clis.md (the claude-account row), cli-refs.
      change: |-
        Delete the files and the rollback target; cut docs/claude-accounts.md to what stays in dotfiles (the owner's registry data and the host adapters: relogin, peer import, keepalive, heartbeat, statusline record) and link the package docs for the rule; update every reference.
      acceptance: |-
        rg finds no reference to the deleted files outside the archive; make check and make doctor pass; claude-account works on both machines and names the package in --version.

