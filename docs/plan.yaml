  # Renovation 2026-11, Track D: flow in a crowded repo (green before the lock, places follow the merge, dead admission gates leave).
  - key: ren-green-before-lock-columns
    prio: 60
    title: "The merge-window ledger takes what refused a window: five nullable columns and the route that fills them"
    facts:
      why: |-
        `factory land` reports each merge window it asked for to the server (`POST /merge-windows`, stored in `factory.merge_windows`: project, worktree, three times and an exit code). The ledger cannot say what refused a window, which head it was for, or whether that head had green CI when it entered (lens F04). `ren-green-before-lock` will send those facts. Its change to `land` is proven on the mini from its branch before the merge, and a branch that holds a migration cannot be proven that way: the migration would be applied live, and every deploy of master would be refused until the branch merges (`apps/server/src/adapters/postgres/migrate.ts` throws on an applied migration the release lacks). So the columns ship first, alone.
      what: |-
        One new migration under `apps/server/migrations`; `MergeWindow` in `packages/contract/src/capacity.ts`; the route in `apps/server/src/api/capacity.ts`; the insert in `apps/server/src/adapters/postgres/capacity-store.ts` and its row type in `apps/server/src/domains/capacity/ports.ts`; `recordMergeWindow` in `apps/server/src/app/capacity-slots.ts`; their tests. The CLI does not change here.
      change: |-
        1. Five nullable columns on `factory.merge_windows`: `step` (text: the step that refused, null when none did), `head` (the sha), `allow_red`, `no_ci` and `entered_green` (booleans).
        2. `MergeWindow` takes them as optional fields `step`, `head`, `allowRed`, `noCi` and `enteredGreen`; the route and the insert pass them through. A body without them stores nulls, as every CLI of today sends it.
        3. Take the migration's number from `make merge-guard` at the last rebase (it prints the next free one), never from this row.
      decided: |-
        Expand only: no column is dropped or renamed, and no reader changes (this plan's).
        No lane: nothing a running lead depends on changes, and an old CLI's report still parses (this plan's, from the maturity check).
      not: |-
        `land` sends the fields in `ren-green-before-lock`. The read of them is `ren-read-flow`.
      acceptance: |-
        A test proves `POST /merge-windows` stores the five fields, and nulls for a body without them.
        `make check-fast` passes.
        After the deploy `make verify` passes on the mini, and `factory read throughput --hours 1 --format json` still counts a window that today's CLI reported.

  - key: ren-green-before-lock
    lane: spine
    prio: 60
    seat: { role: lead, moveUp: true }
    after: [ren-green-before-lock-columns]
    after_needs: shipped
    title: "factory land proves the head green before it asks for the merge lock, opens the pull request itself and records what refused a window"
    facts:
      why: |-
        In a pull-request repo one lead merges at a time, and `factory land` takes the merge lock before it waits for CI (`landVerb` in `apps/cli/src/land.ts` calls `withLock` right after `prepare()`). A branch gets its first full CI run while every other lead waits: refused windows took 17 to 26 % of window time in the three busiest repos (lens F04, 19 to 26 November 2026). A first land is also refused for a missing pull request, and the ledger `factory.merge_windows` keeps only an exit code.
      what: |-
        `land.ts` and `apps/cli/test/land.test.ts`; `reportWindow` in `apps/cli/src/deploy-lock.ts`; the sentence of order 7 in `apps/server/src/domains/leads/brief.ts` that lists land's steps; `docs/operations.md` "Merging". No migration and no route: `ren-green-before-lock-columns` shipped them. A push repo's path stays.
      change: |-
        1. Before `withLock`, in a pull-request repo: rebase, the review check, push, `gh pr create --fill --base <base>` when the branch has none, then the CI wait on the pushed head. A refusal here holds no window.
        2. Then, still before the lock, the repo's merge guard runs once where it has one (`hasGuard`): a taken migration number or a red default branch refuses outside the window.
        3. Inside the lock today's steps stay; a head read green before the lock and unchanged needs one confirming read. `--no-ci` skips the wait.
        4. `reportWindow` sends `step` (what refused, or null), `head`, `allowRed`, `noCi` and `enteredGreen`.
        5. Order 7 says land proves CI green before it takes the window.
      decided: |-
        Exact head stays the rule inside the lock: a default branch that moved during the wait costs one more CI run there (this plan's; lens F04: no merge queue).
        A waiter rebases locally and does not push (this plan's).
        A server without the new fields costs only the report, which is best effort: the rollback's direction (this plan's).
      not: |-
        The lock as a queue: `ren-lock-is-queue`. The read of the new fields: `ren-read-flow`. The rest of the brief: `ren-brief-one-contract`.
      acceptance: |-
        Tests prove: a red head is refused before a lock file exists; a branch without a pull request gets one; a head green before the lock merges after one read; a taken migration number is refused before the lock; the report carries the five fields.
        `make check-fast` passes.
        The branch was proven on the mini with `FACTORY_REF=<branch> make deploy` and `make verify` before the merge; the branch holds no pending migration.
