    after_needs: shipped
    title: "Subscriptions: one read model with history, a forecast and the reason an account is closed"
    facts:
      why: |-
        Program "subscriptions" (owner decision 2026-11-19): handling N Claude Code subscriptions (the factory's word: accounts) moves from dotfiles into the factory, as a part of the product another user can run. Before the program the registry (dotfiles config/claude-accounts.json), the quota cache and the picker (dotfiles scripts/lib/claude-accounts.ts, the claude-account CLI, rule v1.9; design and rationale in dotfiles docs/claude-accounts.md) lived in dotfiles, and the factory server, agent-workflows, usage-tracker and tinycast-extensions call that CLI or read that file. Order: port with no behaviour change (subs-package), switch both machines with a rollback (subs-switch-dotfiles), the new model (subs-model-v2), one read model (subs-read-model), then the server, the Console, the policy lab and the displays, and the old code deleted a week after everything runs on the package.
