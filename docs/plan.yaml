  - key: ren-owner-load-line
    prio: 70
    title: "The owner's load is two KPIs: his acts per 100 shipped Issues with the share of Issues that needed him, and every Errand that took him per day by class and source"
    facts:
      why: |-
        The renovation is judged by how rarely the owner is needed. Three KPIs speak of him today and none says it. Avoidable touches leaves out verdicts and Errands by design: 22 in the week to 26 November 2026, while he acted 95 times on 802 shipped Issues (11.8 per 100). Counted with the 26 requests he closed on a dialog within the minute, which carry no reached_owner_at, 160 Errands took him in the 14 days to 27 November: 11.4 a day.
      what: |-
        packages/contract/src/read-models.ts KPI_KEYS (seven keys), kpi-catalog.ts and thresholds.ts: avoidable_touches, asks_not_needed and errands_reached_per_100 are the owner's three. apps/server/src/read/kpis.ts computes them (avoidableTouches, line 225). Errands are rows of factory.errands with source, need (secret, hands, approval, place), host, command, reached_owner_at, closed_kind, closed_by (apps/server/src/adapters/postgres/errand-store.ts). apps/server/src/read/needs.ts builds his list. Untouched: the touch counts the friction loop reads (TOUCH_LABELS, kpis.ts line 17).
      change: |-
        1. KPI owner_acts: his answered Decisions, his verdicts, the Errands he closed and his notes, wakes, cancels and reopens, per 100 Issues closed done or healed in the window. Parts by kind, and one part needed_him: the share of those Issues with at least one such act on them. Target 2; the part's target 1 %. An Errand no Issue raised counts in errands_reached only.
        2. KPI errands_reached, per day: every Errand that reached him or that he closed (closed_by owner), whatever reached_owner_at says. Parts by class and by source. Target 1.
        3. Class, derived at read: secret (need secret); file (a command whose first program is rsync, scp, cp, find or ls); withheld (need approval, a command with sudo, or a ruleset write as isRuleWrite knows it); command (any other command); hands (the rest). Withheld is its own part, never folded into hands.
        4. Source: lead (the Errand has an Issue), ask-human, other.
        5. The three older keys leave KPI_KEYS, the catalogue and thresholds: the catalogue holds six.
        6. Both are in factory read kpis and, as two figures, in factory read needs and on the Console page of his list.
      decided: |-
        Two owner KPIs instead of five (maturity check M1). Baselines in the descriptions: 11.8 per 100, 5.0 % of shipped Issues, 11.4 a day. This plan's.
        The orchestrator's acts are not counted here.
        A class is derived, never stored (AGENTS.md: facts are stored, state is derived).
      acceptance: |-
        A unit test over a fixed window gives both figures and each part; an Errand the owner closed with no reached_owner_at is counted.
        factory read kpis --format json holds owner_acts with needed_him and errands_reached with parts, and none of the three older keys; factory read needs --format json holds the two figures.
        The lead's Report states both live figures of the last 7 days beside the baselines.
        make docs-check and make check-fast pass.

  - key: ren-errand-repeat-files-cause
    prio: 40
    title: "The second Errand of one shape in 14 days files one Issue that ends the need for hands"
    facts:
      why: |-
        The same request reaches the owner again and again and nobody removes its cause. In the 14 days to 27 November 2026 he was asked five times in four days to unlock one service after a deploy, five times to reseal the secret cache and three times in a row to copy the same files (the factory's errands table).
      what: |-
        apps/server/src/domains/errands/match.ts: matchKeyOf gives an Errand one key, stored as errands.match_key: need: for a name the lead gave, cmd: for the same command, ask: for the same one-line ask in the same repo; normalizeAsk is there too. At the raise, openMatching (apps/server/src/adapters/postgres/errand-store.ts, line 243) joins a new Errand to an open one with the same command, check or key; a need: or ask: key carries its repo. The friction loop (apps/server/src/app/loops/friction.ts, apps/server/src/domains/improve/friction.ts) files Issues from counted waste under deterministic keys (apps/server/src/kernel/keys.ts).
      change: |-
        1. A finder in the friction loop. A group is the Errands of one match key; Errands without a key group by repo and normalised summary. A group with two or more Errands that reached the owner in 14 days files one Issue.
        2. The Issue: title "End the need for hands: <the newest summary>". Its facts list each Errand with date, summary, how it closed and who closed it, and ask for the change after which no person is needed.
        3. The owning repo is the repo of the Issue that raised the Errands. Errands with no repo file in dotfiles, where the MacBook gate, the secret path and ask-human live.
        4. One open Issue per group; a further Errand adds a note. After it closed, the group files again only when two more reached him.
        5. At the raise, a need: or ask: key is also compared without its repo: an Errand whose key equals an open Errand of any repo joins it. One outage raised three Errands from three repos in the record (maturity check M2).
      decided: |-
        It is a finder of the friction loop, so the one finder rule judges it (row ren-finders-one-rule of another track): its figure is Errands reached per day in its groups. This plan's.
      acceptance: |-
        Unit tests: two reached Errands of one match key within 14 days give one filing with both as evidence; a third adds a note and files nothing; one Errand files nothing; two with no repo file in dotfiles; a replayed pass files nothing twice; a raise with the need key of an open Errand of another repo joins it.
        make check-fast passes.

