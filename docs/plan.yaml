        - After this row a rollback goes no further back than the release of the row before; `docs/operations.md` says so in one line.
      acceptance: |-
        - A store test: attempt 1 failed and attempt 2 green give two rows.
        - The Report gives this repo's failed runs of the last 7 days from `factory read throughput --hours 168 --format json` a day before and a day after the deploy.
