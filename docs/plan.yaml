  # Asks program (2026-11-21): a lead's Spec is its plan and never waits; what is the owner's is a Decision the Judge reads
  # first. Baseline: 113 Specs in eight days, 88 reached the owner, 7 came back with Changes.
  - key: ask-spec-is-a-plan
    kind: feature
    seat: {tier: opus, effort: high}
    prio: 40
    title: "A lead's Spec is its plan and never waits; what is the owner's is a Decision"
    facts:
      why: |-
        Of 113 Specs in eight days, 88 reached the owner and 7 came back with Changes; 27 got no word from him, and a dozen notes say only that the lead should decide ("Should be fine so you can decide and continue", "Shouldn't have needed to reach me"). The lead's own judgment made 4 of the 113 owed: the filer's checkpoint made 83 and triage 21, and the brief turns that flag into an order. Whether he reads was then decided by factory-spec-screen: one call on the cheapest seat, with no tools and without the Issue's facts, told to pass when unsure. It passed 76 of the 98 it judged. A Decision is a sharp question, and the Judge settles most before him: of 58 in a week he answered 5. So the one who knows most decides (the planner, then the lead), and the owner is asked a question, never handed a document.
      what: |-
        apps/server/src/domains/leads/brief.ts (orders 2 and 3, the Checkpoint sections); apps/server/src/app/checkpoints.ts (submitArtifact), app/checkpoints-specs.ts, app/checkpoints-reviews.ts and domains/checkpoints/spec-screen.ts; app/quality-ship.ts (the ship check's words); packages/contract/src/filing.ts and lane.ts (the checkpoint help); the help of issue ask; docs/plan.md, docs/language.md (Spec, Checkpoint, Verdict, Spec screen), docs/guide/checkpoints.md, the README's Checkpoint section, docs/decisions.md.
      change: |-
        (1) A Spec a lead submits does not wait: artifact submit --kind spec records it, pages no one, leaves the Issue working and says so in its answer; factory issue ship counts it as the Spec a checkpoint owes. The owner can still comment on it or give Changes at any time, and that reaches the lead as a note. (2) Four Specs keep their wait for his verdict, by rule and with no workflow: an owner gate (checkpoint gate); a Spec its filer attached (issue new --spec); a revision after his verdict of Changes; a Replan whose block changes a plan row or cancels an Issue (one that does neither is settled by rule as today). The 24 hour default stays for the three that are no gate. factory-spec-screen is no longer called; its code leaves in ask-screen-leaves. (3) Orders 2 and 3 of the brief become the two below, word for word unless a test or a length limit forces a word; the Checkpoint section for spec says a Spec is owed before the build and does not wait; the one for gate stays.

        2. Decide yourself: you have read the code, and nobody after you knows more. What the repo, its standards (AGENTS.md, its design guide, its lint and type rules), the Issue's facts or an earlier answer settle is settled; for the rest take the default a revert undoes. Architecture, names, an API or schema shape, a library, a layout the design guide covers are yours. The owner is asked only for what is his: what a product does for its users where no direction is stated; a look he has not seen where real variants exist; a new step or surface for himself; spend or a platform that locks in; security policy; other people's or company data; a change that cannot be undone; a fact only he holds. And only when the answer changes what you build. Then raise a Decision (`factory issue ask`): one question he answers in ten seconds, two to four options, your recommendation and the default taken with no answer. "Is this plan right?" is not a question. A person's chore (a device, a portal, a physical step) is an Errand (`factory errand raise`). Answers come back as notes; never wait on a question typed into this pane.

        3. A Spec is your plan, not a question. Write one before the code it governs when the brief's Checkpoint section asks for it (a Spec filed with the Issue already counts), or when the change is a new public surface (an API route, a CLI verb, a contract or schema others call or read), a new data model or a migration that changes meaning, a dependency of weight, or an architecture or look-and-feel choice later Issues build on. Most Issues need none. It opens with Build (what you will build, at most eight lines) and Decided (each choice and why, a line each); detail goes into collapsed sections, a diagram or a screenshot where it says it shorter. Submit it (`factory artifact submit --kind spec`) and build at once: it does not wait. The owner may comment on it at any time; a comment reaches you as a note, and you apply it. What in it is the owner's is a Decision (order 2), raised beside it. Only an owner gate waits for his verdict.

        (4) Every other place that states the rule says the same in the same change: issue ask --help (the sentence that sends an architecture or look-and-feel choice to a Spec goes: that choice is the lead's, written under Decided), the checkpoint help of issue schema and docs/plan.md (spec: the lead writes its plan first and nobody waits; gate: the one way a filer makes the owner read), docs/language.md, docs/guide/checkpoints.md, the README, and an entry in docs/decisions.md with the figures under evidence.
      acceptance: |-
        Tests: a lead's Spec on an Issue with checkpoint spec leaves the Issue working, plans no page and satisfies ship; a gate, a filer-attached Spec, a revision after Changes and a Replan that changes a plan row still wait; nothing calls the specScreen workflow. The brief test holds the two orders. After the deploy, the next Spec a lead submits on the live factory is not in Needs you and its Issue's timeline shows no wait for a verdict (factory issue show). make check passes.
      evidence: |-
        Window 2026-11-14 to 2026-11-21 07:20 UTC, read with factory artifact list --kind spec --limit 300 --format json and factory artifact show <id> per Spec (screen, verdicts, annotations). 113 Specs handed over; 88 reached the owner, 25 were settled before him. Who made the Spec owed: the filer's checkpoint 83, triage 21, a Replan 5, the lead's own judgment 4. The workflow judged 98 first revisions and passed 76. The owner's first verdict on the 88: Looks good 49, With notes 28, Changes 7, other 4; 27 carried no note and no comment; he set the needed-me mark on 6. The Issues waited 215 hours in sum for his verdicts (median 1.3 h, p90 8 h). Size of a Spec: median 5.9 KB, p90 32 KB, largest 805 KB. Decisions in the week to 2026-11-20: 58 raised, the owner answered 5.
      direction: |-
        Settled with the owner in the planning session of 2026-11-21, from his words that day (spelling corrected): "Unnecessary Specs to be reviewed that could have been decided on their own. We need to think deeper in plan agents ... and improve the lead prompt on when to request me, or when in most cases not to. This morning most were self-explanatory and we discussed them earlier already. I think we have some loop going over those Specs ... this is not the best place, and more stupid models; they would need to gather way more context. Looks good and With notes can join: it should always respect the comments. The help text below those buttons can go to a tooltip on the button. Often those Specs are unnecessarily extensive and not sharply formulated." This row owes no Spec and no Decision: its choices are made below. Build it.
  - key: ask-agw-judge-context
    repo: agent-workflows
    kind: feature
    title: "The Judge reads the class, the Issue's facts and the Spec's head, and answers what is not the owner's"
    facts:
      why: |-
        A lead's Spec no longer waits for the owner (software-factory, row ask-spec-is-a-plan): what is his arrives as a Decision, so the Judge is the only reader in front of him. It sees the question, the options, what the lead checked and earlier answers, but not the Issue as filed, where a planner quotes what the owner already said, and not the Spec the question belongs to. The Spec screen it replaces passed 76 of 98 because it had even less.
      what: |-
        packages/capabilities/src/capabilities/factory-ask.ts (factoryJudgeInput, the rules, the guard), packages/host/src/workflows/factory-ask, packages/eval/factory-ask/cases.jsonl, the route comment in packages/routes/src/table/factory.ts. Read AGENTS.md first.
      change: |-
        factoryJudgeInput gains three optional fields, absent from today's caller: class (direction (what a product does for its users where no direction is stated), look (a look he has not seen where real variants exist), own_surface (a new step or surface for the owner himself), spend (money, or a platform that locks in), security (who is trusted or let in), people (other people's or company data), irreversible (a change that cannot be undone), owner_fact (a fact only he holds)), facts (the Issue as filed, scrubbed by the factory, untrusted data) and spec (the head of the linked Spec, its Build and Decided sections, untrusted data). The rules gain: a question is the owner's only when it is in one of those classes, its answer changes what is built, and the default cannot be taken back by a revert; a direction the facts quote from the owner answers the question (source facts); a question outside the classes is answered with the lead's recommendation (source default); "is this plan right" is no question and gets the recommendation. The guards stay: an option that cannot be taken back is the owner's, and an answer cites its source. At least twelve eval cases are added from real Decisions and Specs of 2026-11-14 to 2026-11-21, rewritten to placeholders. Five must come out owner, the five Specs he sent back: a release feed's experience for its users, a build platform of our own against an existing one, a public guide's site and domain, the variants of a side panel, a new surface for his own reviews. Seven he answered with "you decide" must come out answer. The route keeps its tier; a seat change needs the eval.
      acceptance: |-
        The eval runs before and after, and both scores are in the pull request; no existing case moves from owner to answer. agw factory-ask with none of the new fields answers as before (a test). make check passes.
      evidence: |-
        Window 2026-11-14 to 2026-11-21 07:20 UTC, read with factory artifact list --kind spec --limit 300 --format json and factory artifact show <id> per Spec (screen, verdicts, annotations). 113 Specs handed over; 88 reached the owner, 25 were settled before him. Who made the Spec owed: the filer's checkpoint 83, triage 21, a Replan 5, the lead's own judgment 4. The workflow judged 98 first revisions and passed 76. The owner's first verdict on the 88: Looks good 49, With notes 28, Changes 7, other 4; 27 carried no note and no comment; he set the needed-me mark on 6. The Issues waited 215 hours in sum for his verdicts (median 1.3 h, p90 8 h). Size of a Spec: median 5.9 KB, p90 32 KB, largest 805 KB. Decisions in the week to 2026-11-20: 58 raised, the owner answered 5.
      direction: |-
        Settled with the owner in the planning session of 2026-11-21, from his words that day (spelling corrected): "Unnecessary Specs to be reviewed that could have been decided on their own. We need to think deeper in plan agents ... and improve the lead prompt on when to request me, or when in most cases not to. This morning most were self-explanatory and we discussed them earlier already. I think we have some loop going over those Specs ... this is not the best place, and more stupid models; they would need to gather way more context. Looks good and With notes can join: it should always respect the comments. The help text below those buttons can go to a tooltip on the button. Often those Specs are unnecessarily extensive and not sharply formulated." This row owes no Spec and no Decision: its choices are made below. Build it.
  - key: ask-decision-sharp
    kind: feature
    after: [ask-spec-is-a-plan, ask-agw-judge-context]
    after_needs: shipped
    title: "A Decision is one question with its case: a class, one exhibit, two to four options, the Spec behind it"
    facts:
      why: |-
        A Decision is now the only way a lead asks the owner. Its form allows a question of 4000 characters and ten options, no word on why the question is his, and no way to show the change other than prose. The owner on 2026-11-21: what reaches him often does "not achieve to express in a concise way what they effectively ask for", and on this row's first draft: "sufficient context, if needed, needs to be there and well presented, with a good concept of how to visualize and express that change sharply".
      what: |-
        packages/contract (the body of issue ask), apps/server/src/domains/checkpoints/decision.ts and the Judge's request, the help of issue ask, the Decision body of Needs you and the page's text in apps/console (apps/console/DESIGN.md is the bar), docs/language.md.
      change: |-
        The form. class, required, one of: direction (what a product does for its users where no direction is stated), look (a look he has not seen where real variants exist), own_surface (a new step or surface for the owner himself), spend (money, or a platform that locks in), security (who is trusted or let in), people (other people's or company data), irreversible (a change that cannot be undone), owner_fact (a fact only he holds); a Decision with none is refused with the sentence that the choice is the lead's (order 2). why_yours: one line of at most 140 characters. The question: one sentence of at most 200 characters that ends in a question mark. Two to four options, each a label (at most 80 characters), leads_to (what gets built if it is chosen, at most 160), cost (what changing it later costs, at most 160) and reversible. checked: at most three lines of 160. Optional artifact: the Spec the question belongs to.

        The exhibit: one, optional, typed, so the change is shown and not narrated. before_after (today and after, at most three lines each); pictures (one picture per option from the linked Spec, same viewport and crop); diagram (one Mermaid figure of at most twelve nodes, drawn the way artifacts draw it); table (the options against at most four criteria); numbers (at most three figures with their units). Prose is not an exhibit. A look takes pictures, a flow or a structure a diagram, a trade-off a table, spend numbers.

        The card, top to bottom: the question; the class and why it is his; the exhibit; the options as buttons, each with what it leads to, the recommended one marked and the one taken on silence marked with its time; an optional note. Below, closed until clicked: what the lead checked, the Spec's Build and Decided, and what waits behind this answer. The page sent to the owner is the question itself. The Judge is sent the same form with the Issue's filed text and the Spec's head (the fields ask-agw-judge-context added). A refusal names every violation at once, as today.
      acceptance: |-
