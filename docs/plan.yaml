        Once the Console, the Herdr mod and the Hermes skill read the three counts, the five-word keys of `WorkCounts` are sent and read by nobody. As long as they exist a new surface can pick them up, and nothing stops a second vocabulary from growing back: `scripts/vocabulary.ts` bans five stored words in three places and never checks that a label is the table's. It reads neither the CLI's plain output nor the Hermes skill.
      what: |-
        `packages/contract/src/work-words.ts` (`WORK_WORDS`, `WORK_GROUPS`, `PAUSED_SPLITS`, `READY_LIMITS`, `HELD_SPLITS`, the keys `paused`, `ready`, `held` and `split` of `WorkCounts`, `workOf`), the server reads that fill them, `scripts/vocabulary.ts` and `scripts/vocabulary.allow`, the help texts in `apps/server/src/api/read-models.ts` that say "the five words", and the section "Where work stands" of `docs/language.md`.
      change: |-
        1. The old keys and the functions only they used are removed.
        2. `vocabulary.ts` also scans `apps/cli/src/plain-forms.ts` and `integrations/hermes`, and fails on a count label that is not in the contract's table.
        3. "Where work stands" states the three counts and the table's reasons. Started, Running as a count of its own, Ready, Held and Paused move to its retired column. `apps/console/src/lib/language.gen.ts` is regenerated.
      decided: |-
        No alias and no deprecation window: the Console ships with the server and the two clients moved in the rows before (this plan's).
      acceptance: |-
        - `rg -n "ready|held|paused" packages/contract/src/work-words.ts` finds only the wait kind `paused` in the table.
        - `factory read flow --format json` has no key `ready`, `held` or `paused`.
        - After the deploy the Console strip, `factory read overview` and the Herdr bar show the same three numbers; the Report states them.
        - `make check-fast` passes.
  - key: ren-issue-row-columns-expand
    not_before: 2026-11-30T07:00:00Z
    prio: -10
    title: "The Issue row gets nullable columns for what its events say; nothing reads or writes them yet"
    facts:
      why: |-
        The row `factory.issues` has six columns: id, repo, state, wait reason, outcome, version. Title, kind, seat, size and the dates live only in events, so every read rebuilds them: `FROM` or `JOIN factory.issue_events` stands 178 times in 40 files of `apps/server/src` (lens F02). Row `ren-issue-row-columns` makes the row carry them. It changes the write path of every event, so it is proven on a branch before it merges, and a branch that holds a migration cannot be proven that way: the proof applies the migration live and every deploy of master is refused until the branch merges. So the columns ship first, alone.
      what: |-
        `apps/server/migrations`; `apps/server/src/domains/work/issue.ts` (the `Issue` type is the list of fields) and `evolve` in `domains/work/machine.ts` (what is computed per event). No code under `apps/server/src` changes.
      change: |-
        One expand migration adds nullable columns to `factory.issues` for what `evolve` computes: title, kind, origin, seat, size, checkpoint, attempt, watch, filed at, updated at, closed at, and the wait as JSON. No default that rewrites the table, no CHECK, no index.
      decided: |-
        This plan's:
        - The migration takes the next free number `make merge-guard` names at the last rebase, never a number written in a row.
        - The columns hold null until `ren-issue-row-columns` ships; a release without that row ignores them, so a rollback across this row is safe.
        - The rule "never a column" in `AGENTS.md` is reworded by the next row, not here.
      not: |-
        Writing, backfilling and reading the columns is row `ren-issue-row-columns`.
      acceptance: |-
        - The migration applies on the scenario suite's database and `make check-fast` passes.
        - After the deploy `make verify` passes on the mini, and `factory issue list --format json` answers as before.
        - The Report names the migration's file and the columns.
  - key: ren-issue-row-columns
    lane: spine
    prio: -10
    seat: { tier: opus, effort: high, why: "A data-model change every read builds on." }
    after: [ren-issue-row-columns-expand, ren-drill-weekly]
    after_needs: shipped
    title: "The Issue row carries what its events say, proven by replay; the first read stops folding events in SQL"
    facts:
      why: |-
        The row `factory.issues` has six columns. Title, kind, seat, size and the dates live only in events, so every read rebuilds them: `FROM` or `JOIN factory.issue_events` stands 178 times in 40 files of `apps/server/src`. On 26 November the event table took about 2,750 index scans a second and the route p95 was 503 ms (lens F02). The fold exists once in TypeScript (`evolve` in `domains/work/machine.ts`) and many times in SQL, with no test between them.
      what: |-
        The nullable columns of row `ren-issue-row-columns-expand`; `apps/server/src/adapters/postgres/work-store.ts` (`insertIssue`, `updateIssue`); `domains/work/issue.ts` (the `Issue` type); `apps/server/src/read/issues.ts` (`ISSUE_COLUMNS`, `ISSUE_JOINS`: three subqueries and a lateral join per Issue); `AGENTS.md`; `docs/guide/issues.md` where it repeats the rule.
      change: |-
        1. `insertIssue` and `updateIssue` write the columns in the event's transaction, from the `Issue` the machine returned.
        2. A backfill fills old rows through `replay`, in batches, safe to run twice.
        3. A test replays every Issue of the scenario suite's database against its row and fails on a difference. A script does the same on the live database.
        4. `read/issues.ts` reads a column where it is filled and folds as today where it is null, so the read is right before, during and after the backfill.
        5. `AGENTS.md` says: a column of the Issue row is one its events rebuild, proven by the replay test; a count or timer of anything else is never a column.
      decided: |-
        This plan's:
        - The rule is reworded (from lens F02; the direction of 27 November lists it as taken).
        - Facts stay in events; the row is the fold. No migration in this row.
        - Only `read/issues.ts` moves. Another read moves when another row touches it.
      not: |-
        No index change and no CHECK on the columns.
      acceptance: |-
        - The replay test passes in `make check-fast`; the Report names it.
        - On the mini the check script prints 0 mismatches over every Issue.
        - The branch holds no pending migration and was proven on the mini with `FACTORY_REF=<branch> make deploy` and `make verify` before the merge.
        - A lead that started on the previous release finishes on this one without a hand, and after `make rollback` a lead started on this release finishes on the previous one: a test or one stated reason proves each direction.
        - After the deploy `factory read flow --format json` showed one other Issue that started and one that shipped.
  - key: ren-first-verification-by-proof
    prio: -10
    after: [ren-unread-ci-no-pass]
    title: "First verification says what each pass proved, and counts regressions after the first pass"
    facts:
      why: |-
        The KPI `first_verification_passes` read 96.4 % in the week to 26 November (782 of 811). It proves less than its name. In the week to 27 November 485 of 703 first watches had a window of zero minutes: one look at ship time. Lens F03 found 139 of 782 passes with a CI check marked ok and the detail "CI was not read", 36 with nothing else, and 45 % with a deployed-version check. Six later watches regressed and count nowhere.
      what: |-
        `apps/server/src/read/kpis.ts` (the figure `first_verification_passes` and `regressionParts`), `read/kpis-flow.ts` (`passBeside`), `packages/contract/src/kpi-catalog.ts`, the tables `factory.quality_watches` and `factory.quality_checks` (the `checks` JSON of each run), and the KPI table in `docs/product.md`, which `scripts/kpi-table.ts` generates.
      change: |-
        1. The figure's parts say what the passing run proved: the project's verify ran · a deployed version holds the landed commit · CI was read green · CI was not read · nothing was checked. A pass counts once, under the strongest proof it has, in that order.
        2. Beside it: the share of passes with a full proof (verify or version, and CI read where the project has CI), and the regressions of later watches in the window.
        3. The catalogue's definition says so, and the generated table follows.
      decided: |-
        - The headline stays passed over ended, so its history holds; the parts carry what was proven (this plan's).
        - The target of 90 % stays.
      not: |-
        Storing a watch that could not read CI apart from a pass is row `ren-unread-ci-no-pass`, which lands before this one: read what it stores. A CI check with the detail "CI was not read" in older rows counts as unread. The Watch's second CI run is `ren-watch-no-reprove`.
      acceptance: |-
        - In `factory read kpis --format json` the parts of `first_verification_passes` name the five proofs and add up to the passes.
        - The regressions after a first pass stand beside it.
        - A read-model test holds one pass of each proof and one later regression.
        - The Report states the week's share of passes with a full proof.
        - `make check-fast` passes.
  - key: ren-first-verification-by-proof-ledger
    kind: bug
    prio: -10
    after: [ren-contract-cli-removed-checks]
    after_needs: shipped
    title: "The judgments ledger tells triage from the screen, counts a repeated alert once and shows how many answers were decided"
    facts:
      why: |-
        `factory read judgments --days 30` on 27 November: the screen has 65 answers of which 60 did not stand, a share of 100 %; the steward has 0 answers. Both lines are wrong.
        - A dismissal is stored as `dismissed_by = 'judge'` whether triage's workflow found the ask covered (`coveredBy` in `apps/server/src/app/intake-alerts.ts`) or the screen dismissed held text. In 14 days 70 of 77 such rows came from alert sources.
        - The ledger counts every repeat: 53 dismissals were 5 fingerprints (lens F03).
        - Every `loop_calls.answer` of 30 days is a JSON string inside a jsonb column, 3,394 rows: `finishCall` in `adapters/postgres/call-store.ts` casts `JSON.stringify(...)` to jsonb. So `answer->>'action'` is null and the steward's row stays empty.
        - The default window is 7 days; an answer needs up to 14 to count as stood.
      what: |-
        `apps/server/src/read/judgments.ts`, `kernel/judgments.ts`, `adapters/postgres/call-store.ts`, `app/intake-alerts.ts`, `app/intake-held.ts`, `adapters/intake/store.ts` (it parses `dismissed_by` with a zod enum), and the contract's list of ledger judges. The CHECK on `intake_signals.dismissed_by` is gone after row `ren-contract-cli-removed-checks`, so the new values need no migration.
      change: |-
        1. New rows store `triage` or `screen` in `dismissed_by`. The screen's line counts `screen` only; triage's line gains its dismissals; an old `judge` row counts as unknown.
        2. The screen's and triage's lines count one subject (source and fingerprint) once per window.
        3. `finishCall` stores an object. The reads accept both forms, for the old rows.
        4. Each line shows decided (stood plus did not stand) beside its answers. The default window is 30 days.
      decided: |-
        This plan's. Old `judge` rows are not rewritten. No migration in this row.
      not: |-
        What the steward decides is row `ren-steward-decides-stalls`; if that row already repaired `finishCall`, state part 3 as met. The Judge's own line leaves with `ren-judge-leaves`.
      acceptance: |-
        - A store test: the answer of a finished call has the jsonb type object.
        - A read-model test: five dismissals of one fingerprint count as one answer.
        - A day after the deploy `factory read judgments --format json` shows answers above 0 for the steward, and every line carries `decided`.
        - `make check-fast` passes.
  - key: ren-first-verification-by-proof-ci-attempts
    not_before: 2026-11-30T07:00:00Z
    kind: bug
    prio: -10
    title: "The CI ledger keeps every attempt of a run, so a rerun no longer hides a failure"
    facts:
      why: |-
        `factory.ci_runs` has the key (repo, run id), and `recordCiRuns` in `apps/server/src/adapters/postgres/improve-store.ts` overwrites a run on conflict. A failed run that was run again and went green is stored as green. In 14 days 14 default-branch runs of this repo carried an attempt above one and 10 of them read green (lens F13). The ledger showed 2 red default-branch runs where the Watch had seen 10 (lens F04). Every figure of failed runs per Issue or per repo is too low by the reruns.
      what: |-
        The table `ci_runs` of migration 1026 (primary key: repo and run id); `improve-store.ts` (`recordCiRuns` upserts on that key, `newestCiRun`, `pruneCiRuns`); `apps/server/src/app/loops/ci-ledger.ts` and the GitHub reader it calls (check whether it can read the earlier attempts of a run); the readers `read/merge-capacity.ts` and `read/throughput-account.ts`.
      change: |-
        1. An expand migration adds a unique key over repo, run id and attempt beside the primary key.
        2. `recordCiRuns` writes one row per attempt against the new key. While the old primary key still refuses a second row for a run, it overwrites that row, as today.
        3. For a run whose attempt is above one the pass reads the earlier attempts too.
        4. A reader that counts runs or durations takes the newest attempt of a run. A reader that counts failures counts every failed attempt. Both are right under either key.
      decided: |-
        This plan's:
        - A run counts once for its duration and once per failed attempt for failures.
        - The old primary key is dropped by row `ren-first-verification-by-proof-ci-attempts-key` two days later, so a rollback of this row finds the key its upsert names.
        - The migration takes the next free number `make merge-guard` names at the last rebase, never a number written in a row.
      acceptance: |-
        - A store test on a schema without the old primary key: attempt 1 failed and attempt 2 green give two rows.
        - A store test on today's schema: the second attempt overwrites and nothing fails.
        - A read-model test: two attempts of one run count as one run and one failure.
        - `make check-fast` passes.
  - key: ren-first-verification-by-proof-ci-attempts-key
