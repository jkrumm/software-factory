      not: |-
        Quota at reset is row `ren-kpis-true`.
      acceptance: |-
        - A read-model test: a dropped Issue changes no cycle figure.
        - `factory read kpis --format json` shows the p90, the oldest open Issue and the dollars by seat beside `cycle_p50`.
