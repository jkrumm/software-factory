  - key: ren-read-flow
    prio: -5
    after: [ren-green-before-lock]
    after_needs: shipped
    after_days: 7
    title: "Read the merge window a week after land proves green first: wait per repo, windows entered green, burned windows, overtakes"
    facts:
      why: |-
        The merge window is where queued hours go: leads waited 150 hours for it in the week to 26 November 2026 (lens F04). `ren-green-before-lock` changed the entry. Four rows wait for this read: the places rule is tuned on the window hold that the entry fix changes.
        Baseline, 20 to 27 November 2026, `factory read throughput --hours 168`: basalt-ui 407 windows, 39.8 hours waited, p90 17.6 minutes; software-factory 258, 44.0 hours, p90 30.5; weatherorb 147, 52.7 hours, p90 66.3. Lens F04's week: 10 % of basalt-ui's windows entered green, burned windows took 17 to 26 % of window time, 22 to 42 % of waits were overtaken.
      what: |-
        `apps/server/src/read/throughput-account.ts` (the `mergeLock` block per project, read from `factory.merge_windows`), its contract schema and its test; `docs/plan.yaml`.
      change: |-
        1. `project[].mergeLock` of `factory read throughput` gains `merged` (exit 0), `burned` and `burnedMinutes` (acquired, held 20 s or longer, not merged), `enteredGreen` (share of acquired windows), `overtaken` (waits during which a later request got the window first), `gaveUp` (never acquired), `holdMedianMinutes` over merged windows and `refusedBy` (count per `step`).
        2. Run it over the seven days since `ren-green-before-lock` deployed and hand in a Report (`factory artifact submit <id> --kind report`): one table per repo beside the baseline.
        3. In the same pull request write the measured median hold per repo into the `why` of `ren-places-follow-merge` in `docs/plan.yaml`, and correct any figure of `ren-lock-is-queue`, `ren-watch-no-reprove` and `ren-landing-tokens-read` that the week contradicts.
      decided: |-
        The read is built here and reads backwards: the ledger has the columns since `ren-green-before-lock` deployed (this plan's).
        This row drops no row. A waiting row whose premise the week removed stays, with corrected facts (this plan's).
      acceptance: |-
        `factory read throughput --hours 168 --format json` prints the new fields for the three repos.
        A test of the read covers a burned window, an overtaken wait and a window that entered green.
        The Report is on the Issue and holds both tables.
        `factory plan check docs/plan.yaml` and `make check-fast` pass.

  - key: ren-lock-is-queue
    lane: spine
    prio: -5
    seat: { role: lead, moveUp: true }
    after: [ren-read-flow]
    title: "The merge lock is a queue by request time, held by pid and start time: no overtaking, no give-up while the line moves"
    facts:
      why: |-
        The merge lock is a symlink to the holder's pid (`apps/cli/src/pid-lock.ts`), and every waiter polls it every 2 s (`holdAndRun` in `apps/cli/src/deploy-lock.ts`). The first poll after a release wins, whoever asked first. Lens F04, 19 to 26 November 2026: 22 to 42 % of waits in the three busiest repos were overtaken by a later request, and 15 ended at the 90-minute limit (`FACTORY_MERGE_LOCK_WAIT_MS`) with nothing merged. A holder counts as alive by its pid alone, so a pid the system gave to another process holds the window. Read the Report of `ren-read-flow` first.
      what: |-
        Those two files, `apps/cli/test/deploy-lock.test.ts`, `docs/operations.md` "Merging", `docs/settings.md`. `apps/cli/src/local-slots.ts` also calls `tryTake` and must keep working.
      change: |-
        1. A lock names its holder by pid and the process's start time. A pid alive under another start time is a dead holder and is reclaimed.
        2. The merge lock is a queue: a waiter leaves a ticket with its request time, pid and start time beside the lock, and takes the lock only when no live ticket is older. Whoever sees a dead waiter's ticket removes it. A waiter prints its place in line.
        3. The 90-minute limit counts from the last time the line ahead moved.
        4. The deploy lock gets pid and start time, and no queue.
      decided: |-
        Tickets are files in the lock directory, no server call: an unreadable lock or ticket directory exits 75 (this plan's; the rule "deploy locks fail closed").
        A reader accepts a lock written before this change (a bare pid). A waiter on the old CLI exits 75 on the new format, and its lead lands again (this plan's).
      acceptance: |-
        Tests prove: five waiters get the lock in the order they asked; a dead waiter's ticket is skipped; a pid under another start time is reclaimed; an unreadable ticket directory exits 75; a waiter behind a moving line outlives 90 minutes.
        `make check-fast` passes.
        The branch was proven on the mini with `FACTORY_REF=<branch> make deploy` and `make verify` before the merge; the branch holds no pending migration.
        After the deploy `factory read flow --format json` showed one other Issue that started and one that shipped.
        A lead that started on the previous release finishes on this one without a hand, and after make rollback a lead started on this release finishes on the previous one: a test or one stated reason proves each direction.

  - key: ren-watch-no-reprove
    prio: -5
    after: [ren-read-flow, ren-fix-follow-read]
    title: "The Watch takes the head's green CI run when the merged tree equals the head's tree, and waits only for workflows the head did not run"
    facts:
      why: |-
        `factory land` merges only a head that holds the default branch and has green CI, so the merged commit has the head's tree. The Watch then waits for a second run of that tree on the default branch: `MakeAndProbes.ci` in `apps/server/src/adapters/quality/proof.ts` asks `ofCommit` for the merged commit, and `ciCheck` in `apps/server/src/domains/quality/watch.ts` answers blocked while it runs. Lens F04, 19 to 26 November 2026: 504 such runs, a median dwell of 8.0 minutes, and 8 of the 10 regressions on that check shipped again with the same commits. Lens F17 found the one real catch: a workflow that runs only on push (Issue 2381).
      what: |-
        Those two files, `apps/server/src/adapters/quality/ci.ts`, the ship's commits in `apps/server/src/domains/quality/evidence.ts` and `apps/server/src/app/quality-ship.ts`, the tests under `apps/server/test/quality/`, `docs/architecture.md` "Quality".
      change: |-
        1. At the ship, store with the commits the pull request's head sha (`ofShip` finds it) and whether the merged commit's tree equals the head's.
        2. In the Watch, with equal trees and a green head: a check of the merged commit that the head ran green under the same name counts as green. A check the head did not run is judged as today.
        3. When the merged commit shows no check yet: pass at once, unless `factory.ci_runs` holds for this repo's default branch, in the last 30 days, a `push` run of a workflow that never ran on `pull_request`. Then wait as today.
        4. The check's detail says which rule passed it.
      decided: |-
        Unequal trees, a head whose CI was not read, or a repo without rows in `factory.ci_runs`: today's behaviour. The compare is made once, at the ship, and stored (both this plan's).
      not: |-
        A Watch that could not read CI: `ren-unread-ci-no-pass`. Verify, the deployed version and the probes do not change.
      acceptance: |-
        Tests prove: equal trees and a green head pass while the default branch's run still runs; a check only the default branch runs is waited for, and regresses when red; unequal trees behave as today.
        `make check-fast` passes.
        After the deploy, the Watch of the next software-factory Issue that ships shows a `ci` check whose detail names the head's sha.

  - key: ren-places-follow-merge
    prio: -5
    seat: { role: lead, moveUp: true }
    after: [ren-read-flow]
    title: "Places in a pull-request repo follow what its merge clears: start at 2, one more an hour while merges wait under one window hold, one less over two"
    facts:
      why: |-
        No admission gate reads a merge. A repo's places are `leads:` of its project file, 64 when unset (`claimRoom` in `apps/server/src/domains/capacity/claims.ts`). Lens F11, 19 to 26 November 2026, measured what each pull-request repo carries before a merge waits more than two window holds: 6 to 7 leads in basalt-ui, 4 to 5 in software-factory and in weatherorb. Hours above those counts were 21 % of the three repos' hours and carried 83 % of their merge wait. Read the Report of `ren-read-flow` first.
      what: |-
        `apps/server/src/app/capacity-admit.ts` (it passes `leads: project.project.leads` to admission twice), the minute pass in `apps/server/src/app/capacity-aim.ts`, a store method and a migration for the count (its number: the next free one `make merge-guard` prints at the last rebase), the `claim` refusal's message, `factory read project-page`, `docs/project.md` ("Choosing the values", "Lanes").
      change: |-
        1. A project whose `ship` has `via: pr` gets a places count, stored with the time and reason of its last step. It starts at 2.
        2. Once an hour, from `factory.merge_windows` of the last seven days: the median wait (request to acquire) of the last five merged windows against the median hold of all merged ones. Under one hold, with a queued Issue of the project refused only for `claim`: one more. Over two holds: one less. Never under 2 or above the file's `leads:`.
        3. Admission uses the smaller of `leads:` and the count. A fix keeps its extra place; running leads are never touched.
        4. The `claim` refusal names the count. `factory read project-page <repo>` shows it with its last reason.
      decided: |-
        Places follow the merge (this plan's, from the direction page's ruling of 26 November 2026).
        Flow over peak output (lens F11's tendency; this plan's).
        Fewer than five merges in seven days: no step down, one more when an Issue wants a place (this plan's).
      not: |-
        No finder changes `leads:`: `ren-finder-leaves-settings`.
      acceptance: |-
        Tests prove: a pull-request project starts at 2; five merges under one hold with a `claim` refusal add a place after an hour; over two holds takes one off; the count never passes `leads:`; a push project has none; a fix is admitted beyond it.
        `make check-fast` passes.
        After the deploy `factory read project-page software-factory --format json` shows the count.

  - key: ren-loop-issues-last
    prio: -5
    after: [ren-dated-work]
    title: "Issues a loop filed start last in their repo: an order inside one project, nothing held back"
    facts:
      why: |-
        The improving loops (hygiene, friction, selfwatch, throughput) filed 383 Issues in the 14 days to 26 November 2026. Those took 13 % of the merge windows (406 of 3,230) for 3 % of the lead dollars (lens F13). A loop's Issue queues like any other: `orderQueue` in `apps/server/src/domains/planning/queue.ts` sorts by fix, the owner's prio, the project's prio and the Issue number, then inside one project and prio by size with ageing (`sooner`). Nothing marks an Issue as a loop's: its `filed` event reads origin `factory`, actor `factory`, as a plan row's does.
      what: |-
        `orderQueue` and `OpenIssue` in that file; `PAYLOADS.filed` in `apps/server/src/domains/work/events.ts`; the path a loop files through (`file` in `apps/server/src/app/intake-entry.ts` takes the `finding`; `apps/server/src/compose-loops.ts` wires every loop to it); `apps/server/src/read/planning.ts`, which builds `OpenIssue`; tests under `apps/server/test/planning/`; `docs/architecture.md`.
      change: |-
        1. The `filed` event of an Issue that intake files from a loop's finding carries `loop: <name>`, an optional field.
        2. `OpenIssue` gets `loop` from it. `sooner` puts an Issue with a loop behind one without, in front of the size key. An Issue of kind bug or incident is never sorted behind for its loop: a failed drill or a red line files such an Issue, and its repair must not wait.
        3. A loop filing that passes no finding today (the friction pass's retro Issue, the throughput loop's cap signal) passes one.
        4. Build on the field `ren-dated-work` added to the same payload.
      decided: |-
        An order, never a hold: it acts inside one project, rank and owner prio. A fix stays first, `factory issue prio` still wins, other projects keep their order (the track's; lens F13's tendency).
        A loop's Issue queued for 24 hours sorts like any other, so none starves (this plan's).
        Issues filed before the deploy carry no mark. A signal a retro lead files is a lead's (this plan's).
      not: |-
        The per-account caps leave in `ren-loop-issues-last-caps`.
      acceptance: |-
        Tests of `orderQueue` prove: of two queued Issues of one project the loop's stands behind though older and smaller; an owner prio puts it first; an incident a loop filed stays first; after 24 hours it sorts by size again; another project's Issues keep their places.
        A test proves the `filed` event of a loop's signal carries `loop`. `make check-fast` passes.

  - key: ren-lead-aim-reads-load
    not_before: 2026-11-29T07:00:00Z
    prio: -5
    title: "The lead aim reads the test line and the host's load, not memory pressure, and its hold is recorded under its own word"
    facts:
      why: |-
        Admission's last gate is the lead aim: a count of leads the host takes, moved once a minute by `leadAimStep` in `apps/server/src/domains/capacity/slot-aim.ts`. It reads memory pressure: each pressured minute halves the count, so three take 14 leads to 1. Lens F11, 19 to 26 November 2026: the aim held 430 Issues for 323 hours, and pressure was normal in 2,346 of its 2,560 binding minutes. Its refusal is stored as `memory` (`no('memory', aimed, null, 'aim')` in `apps/server/src/domains/capacity/admission.ts`). What binds the host is the test line: steps per hour stop rising at 9 to 11 leads.
      what: |-
        `leadAimStep` and `LeadAimSignals`; `apps/server/src/app/capacity-aim.ts`; `aimRefusal`, `LeadAimGate` and `REFUSALS` in `admission.ts`; `apps/server/src/domains/capacity/waits.ts`; the count of the aim's waiters in `apps/server/src/compose-loops.ts`; `apps/server/test/capacity/lead-aim.test.ts`; `docs/guide/capacity.md`. `aimStep` (test slots) is `ren-lead-aim-reads-load-slots`.
      change: |-
        1. `leadAimStep` reads the test line (the `TestLine` that `lineRefusal` judges) and the load tripwire. Pressure, swap and swap-outs are no input.
        2. Down: when the line turns long or the tripwire trips, the count is one less than the leads running, never under 1, once per episode. An episode ends when both are clear.
        3. Up, as today: one more after two clear minutes while the count binds and the aim alone holds a queued Issue.
        4. With neither signal read, the count holds and admits nothing beyond what runs.
        5. The refusal is its own kind `aim` in `REFUSALS` and in `factory.queue_intervals` (a text column: no migration). Its message names the signal, never memory. Where the contract's table of reasons exists by then, `aim` gets its row there.
      decided: |-
        Memory keeps its own guard, the memory reading (kind `memory`), and the load tripwire stays a gate of its own (the track's).
        Stored intervals keep their kind (this plan's).
        Its reason word is "the host", as for `load`, `memory` and `tests`; its count is Not started. A machine ends it: the aim adds a lead after two clear minutes (this plan's, from the maturity check).
      acceptance: |-
        `lead-aim.test.ts` proves: three minutes at pressure level 2 with a short line and a clear tripwire leave the count; a line that turns long sets it to one less than running, once; an aim refusal has kind `aim`.
        `make check-fast` passes.
        After the deploy the ship states the hours of `aim` and `memory` in `answers.queue.byReason` of `factory read throughput --hours 1 --format json`.

