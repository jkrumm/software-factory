        6. The three documents say: a factory lead may run on OpenCode on an open model through the gateway; every other agent session stays on the subscriptions.
      decided: |-
        Part 1's command line is fixed: the factory's profile calls it; the rest follows the spike's Report. It runs as the gateway caller oc: no new token (this plan's).
      not: |-
        No gateway change and no budget read.
      acceptance: |-
        scripts/oc-lead --tier nope --effort high --session s x exits 64 and names open.
        A test with a stub opencode on PATH asserts the argv, the gateway variables, the database path, and no token on argv.
        On the mini a session started through it under FACTORY_SESSION=probe prints probe from a shell tool, and the gateway's usage record has a row bound to probe.
        docs/opencode.md has a section "A factory lead". make check passes.

  - key: ren-opencode-profile
    prio: -10
    after: [ren-program-profile-seat, ren-open-seat-launcher]
    after_needs: shipped
    seat: { role: lead, moveUp: true }
    title: "The OpenCode profile: a lead on an open model starts, reports its turns, takes notes and resumes like any lead"
    facts:
      why: |-
        The owner, 27 November 2026: open models should "reuse or use the free quota that I have". The seam (LeadProgram, a role row's program) and the start line (dotfiles scripts/oc-lead) exist; a spike's Report lists what OpenCode needs. Missing: the profile, the plugin that reports its turns, a role row.
      what: |-
        New apps/server/src/adapters/programs/opencode.ts and integrations/opencode; config/roles.json; adapters/leads/settings.ts; a per-Issue section in domains/leads/brief.ts; AGENTS.md, docs/architecture.md, integrations/README.md.
        Untouched: the standing orders constant.
        The Report: factory project plan software-factory names the Issue of row ren-opencode-by-hand.
      change: |-
        1. Profile opencode. Start and resume: <launcher> --tier <tier> --effort <effort> --session <id> <text>; the launcher from FACTORY_OPENCODE_BIN (default: dotfiles scripts/oc-lead), the id from the spawn key. Environment: a lead's FACTORY_ variables, the project's env, OC_LEAD_PLUGINS naming the release's integrations/opencode. Notes as the spike proved. Stop is terminal.kill.
        2. Plugin integrations/opencode/factory-lead: OpenCode's events become factory hook session-start, user-prompt-submit, stop, stop-failure and session-end with the payload apps/cli/src/hook.ts reads. Inert without FACTORY_SESSION; a failing hook never fails a turn; a stop sent back (exit 2) becomes input once.
        3. config/roles.json gains "open": { "tier": "open", "effort": "high", "program": "opencode" } (the tier word exists since ren-program-profile-seat).
        4. The brief's per-Issue part gains a section from the profile: no @implementer, Explore or /review subagents, and how a ship range gets its review.
        5. An OpenCode lead takes no account seat (it runs on default).
      decided: |-
        Never a model id here: a tier word the launcher maps (AGENTS.md).
        A work project's Issue seated on an OpenCode row starts on the lead row, with a note (this plan's).
        Only a filed seat reaches the row. FACTORY_OPENCODE_BIN is the open seat's one setting (this plan's).
      not: |-
        The light rule and the credit: ren-open-seat.
      acceptance: |-
        Tests pin the profile's argv and environment and the plugin's mapping.
        A test: a work project's Issue with seat { role: open } starts on the lead row with the note.
        factory role get open --format json prints {"role":"open","tier":"open","effort":"high"}.
        make check-fast and make docs-check pass.

  - key: ren-opencode-first-issue
    prio: -10
    kind: docs
    after: [ren-opencode-profile]
    after_needs: shipped
    seat: { role: open, moveUp: true }
    title: "docs/guide/leads.md describes both lead programs: the first Issue an OpenCode lead ships"
    facts:
      why: |-
        docs/guide/leads.md opens with "A lead is an interactive Claude Code session in a herdr-core terminal". Since the program profile and the OpenCode profile shipped, that is false. This is also the first Issue the factory starts on the role row open, an OpenCode lead on an open model: it proves the path of a filed Issue on the second program, from brief to watch.
      what: |-
        docs/guide/leads.md only. The facts are in apps/server/src/domains/leads/ports.ts (LeadProgram), apps/server/src/adapters/programs/claude-code.ts and opencode.ts, integrations/opencode/README.md, config/roles.json.
      change: |-
        1. Say what a lead is in terms of a program: an interactive session of a lead program in a herdr-core terminal, described by a profile (how it is started with a brief, how a note reaches it, how it is resumed, which events it reports, how it is stopped).
        2. One table with the two profiles side by side for those five points, from the code.
        3. Keep every other statement. Write "the lead program" where a sentence holds for both, and leave "Claude Code" where it holds for Claude Code only (accounts, compaction, the transcript archive).
      decided: |-
        If the Issue moved up to you, you are not the OpenCode lead. First read why it stopped (factory read session lead-<issue>-1 and its handover), fix the profile or the plugin in this Issue if that was the cause, then write the page, and name the cause in the ship (this plan's).
        No code block and no model id on the page (this plan's; AGENTS.md bars a model id).
      not: |-
        No other document.
      acceptance: |-
        factory issue show of this Issue shows ranOn with tier open and program opencode on attempt 1.
        The ship says which attempt shipped; if not attempt 1, why the OpenCode lead stopped and what was fixed.
        rg -n "interactive Claude Code session" docs/guide/leads.md finds nothing, and the page has the table.
        make check-fast and make docs-check pass.

  - key: ren-open-seat
    prio: -10
    after: [ren-opencode-first-issue]
    after_needs: shipped
    seat: { role: lead, moveUp: true }
    title: "Light Issues of open projects start on the OpenCode seat while the metered credit lasts"
    facts:
      why: |-
        The role row open (an OpenCode lead on an open model) is reached only by a filed seat. The owner, 27 November 2026: "More like $500 of spare credit a month for open source models." That is the metered key's rolling 30-day cap (24 dollars spent on 27 November).
      what: |-
        seatOf in apps/server/src/app/leads-start.ts; domains/leads/light.ts; a new adapter for the spend snapshot; read/kpis-seats.ts and usage.ts; SeatKpiRow in packages/contract.
      change: |-
        1. An Issue the light rule names starts on open instead of light when all hold: its project is no work project; the open seat's gate is not shown worse; fewer than two OpenCode leads run; the metered key's rolling 30-day spend is under 400 dollars. Otherwise light: nothing waits.
        2. The spend is read from the snapshot file the gateway's wallet gate reads, at that gate's default path (agent-workflows packages/limits/src/spend.ts, defaultSnapshotPath); missing or older than 48 hours reads as no credit.
        3. The seat keeps the light rule's name, so a struggling lead moves up to the lead row, once.
        4. The gate: judgeLightGate on the open seat against the light row; unmeasured is open.
        5. factory read seats shows the open seat as its own row, with dollars per Issue from the usage rows bound to its sessions (x-agw-session is the spawn key); its Issues leave the light row's figures.
      decided: |-
        It stops at 400 of 500 dollars, the gateway's wallet line: the rest is for the factory's agw workflows. Two OpenCode leads at once: each runs a private server. Both figures and the path are constants beside the rule, not settings (this plan's).
        Never a shadow project (this plan's: a work repo's text stays off a metered open model until the owner says otherwise).
      acceptance: |-
        Tests of seatOf: open for a light Issue of an open project; light for a work project, a stale snapshot, a spend of 400, two OpenCode leads, a gate shown worse; a struggling open-seat lead moves up to the lead row.
        factory read seats --format json has the open seat's row with dollars as a number.
        During the Watch one Issue's first lead ran on the open seat; if none, the ship names the condition that held.
        make check-fast passes.

  - key: ren-read-second-program
    prio: -10
    kind: chore
    after: [ren-open-seat]
    after_needs: shipped
    after_days: 7
    title: "Read after a week: what the OpenCode seat shipped, its fix-follow, move-ups and dollars against the light row"
    facts:
      why: |-
        For seven days light Issues of open projects could start on the open seat (an OpenCode lead on an open model). It is judged by one line: one light Issue a day ships on it without a hand. The plan's rule: a change like this is judged by fix-follow, not by argument. Before it, the light row took 261 Issues a week at 0.61 dollars; 96.2 % passed their first watch, 20 % moved up.
      what: |-
        No code. The reads: factory read seats --days 7 --format json, factory read friction --days 7, factory read session for the open seat's sessions, their usage rows, the spend snapshot the open seat's rule reads.
      change: |-
        Write a Report for the seven days:
        1. Issues whose first lead ran on the open seat; how many shipped there; per day.
        2. Of those, how many had a fix within 72 hours, beside the light row's share.
        3. Move-ups from the open seat by sign, beside the light row's.
        4. Dollars per Issue beside the light row's, and the key's rolling 30-day spend against the stop.
        5. Every act of a person on one of these Issues (a note, an Errand, a Decision, a cancel).
        6. What kept light Issues off the seat: work project, two leads running, the gate, the credit.
      decided: |-
        The line is met when seven Issues or more shipped on the open seat in the seven days with no act of a person (this plan's).
        If not met, the largest cause becomes one plan row, committed to docs/plan.yaml with this Issue; nobody is asked (this plan's).
      acceptance: |-
        A Report (factory artifact submit --kind report) holds the six figures, each with its command or query, and says met or not met in its first sentence.
        Not met: docs/plan.yaml has one new row for the largest cause, and factory plan check passes.
        Met: the Issue is closed done, the Report's id in the reason.

  - key: ren-shadow-settings
    not_before: 2026-11-30T07:00:00Z
    prio: -10
    title: "A project's file takes three settings: who merges, which accounts work there, where the repo's rules are"
    facts:
      why: |-
        A shadow project is a work repo whose project file is on the host. Nothing in that file says who merges: factory land stops where the forge wants a review, and leads merged as admin by hand (145 merges, none approved). The repo's own rules are a comment no lead sees. The owner, 27 November 2026: "key values in the project YAML configurations about which projects are allowed to be automatically merged by the factory". This row adds the keys; later rows read them.
      what: |-
        packages/contract/src/project-file.ts (projectObject, strict), schema/project.schema.json, the key table and "Choosing the values" of docs/project.md, docs/operations.md "Deploy"; the three host files on the mini.
        Untouched: apps/cli/src/land.ts, the brief, admission.
      change: |-
        1. Three optional keys: merge (factory or person), accounts (a list of account names), rules (up to eight paths, in the repo or absolute).
        2. One function in the contract answers who merges: the key, else person for a host-local file and factory for a committed one.
        3. After the deploy the three host files on the mini get merge: factory, as they merge today, and factory project check passes on each.
        4. docs/operations.md "Deploy": a rollback past this release first takes the three keys out of the host files and waits for the sync, because the earlier schema refuses a stored project that carries them (StoredProjectFile is strict).
      decided: |-
        merge is the one statement of who merges in a project (this plan's).
        Unset is a person's approval for a shadow project (this plan's). Part 3 carries the owner's standing entry over: all three repos are on the admin-merge list of the dotfiles hook review-bypass-guard. A lead may write a host file, never commit one (this plan's).
        Nothing reads the keys yet: this row changes no behaviour (this plan's).
      not: |-
        land and the brief: ren-shadow-settings-land. accounts: ren-shadow-settings-accounts. The dotfiles list stays as a copy until that hook reads the key.
      acceptance: |-
        Contract tests: the three keys parse; merge: maybe is refused; the function answers person for a host-local file without the key and factory for a committed one.
        factory project check passes a host file with the three keys.
        factory read project-setup shows merge factory for the three shadow projects.
        make check-fast and make docs-check pass.

  - key: ren-shadow-settings-land
    prio: -10
    lane: spine
    after: [ren-shadow-settings, ren-green-before-lock]
    after_needs: shipped
    seat: { role: lead, moveUp: true }
    title: "factory land follows a project's merge setting: it merges, or it waits for a person's approval and holds no merge window"
    facts:
      why: |-
        A project's file can say who merges (merge: factory or person; unset is person for a shadow project's host file). Nothing reads it: factory land stops where the forge wants a review (44 of 56 merge windows failed so in one shadow project), and leads merged as admin by hand. The owner, 27 November 2026, asked for settings on "which projects are allowed to be automatically merged by the factory".
      what: |-
        apps/cli/src/land.ts (readProject, the steps before the lock, the merge step) and apps/cli/test/land.test.ts; the per-Issue part of apps/server/src/domains/leads/brief.ts with its input in app/leads-start.ts; docs/operations.md "Merging".
        Untouched: the standing orders constant.
      change: |-
        1. land reads merge where it reads ship (readProject), through the contract's function.
        2. person: once the head is green and before the merge lock, land reads the pull request's approval. Not approved: it records the wait itself (as factory issue defer --review does; Issue and attempt from the branch name) and exits 0. Approved: the window as today. Always by pull request.
        3. factory: as today; refused only for a missing review, land merges with --admin and says so.
        4. The brief's per-Issue part names who merges in this project and lists its rules paths.
      decided: |-
        While the request waits, the Issue waits on others and its place is free, as a review wait is today (this plan's).
        land needs neither the dotfiles admin-merge list nor its hook (this plan's).
      not: |-
        No check of branch names or commit form: rules are read, not enforced.
      acceptance: |-
        Tests of land: person unapproved records the wait, exits 0 and no lock file exists; person approved merges; factory merges with --admin on a review refusal; a committed file without the key lands as before.
        A brief test shows the merge line and the rules paths only where set.
        make check-fast passes.
        The branch was proven on the mini with FACTORY_REF=<branch> make deploy and make verify before the merge; the branch holds no pending migration.
        After the deploy factory read flow --format json showed one other Issue that started and one that shipped.
        A lead that started on the previous release finishes on this one without a hand, and after make rollback a lead started on this release finishes on the previous one: a test or one stated reason proves each direction.

  - key: ren-shadow-settings-accounts
    prio: -10
    after: [ren-shadow-settings]
    after_needs: shipped
    seat: { role: lead, moveUp: true }
    title: "A project's accounts setting says which accounts its leads run on; admission and the account move honour it"
    facts:
      why: |-
        Nothing ties a repo to an account: pickAccount takes readings, caps and counts, and a lead whose account ran out moves to any open one. Of 123 lead attempts in shadow projects from 6 to 26 November, 70 (57 %) ran on a personal account, not the work organisation's. The plan makes the account a setting of the project's file, beside the owner's merge setting (lens F19). The key exists in the schema (accounts, a list of account names); nothing reads it.
      what: |-
        apps/server/src/domains/capacity/accounts.ts (PickInput, pickAccount) and admission.ts (checkAdmission); apps/server/src/app/capacity-admit.ts (moveWalled, and where admission's inputs are built); docs/project.md "Choosing the values"; apps/server/test/capacity.
        Untouched: packages/accounts, the schema.
      change: |-
        1. PickInput gains an optional list of allowed accounts: only their readings are candidates, in the package's order.
        2. checkAdmission passes the candidate's project's list; moveWalled passes it too, so a moved lead stays inside it.
        3. With no listed account free, the wait is window, whatever kept each listed account out, and its reason names the project's list and who ends it: the first listed account that opens. A name no reading carries is said there and in the project's warnings.
        4. No accounts key: as today.
      decided: |-
        A setting, not a secret and not a gate; unset means any account (this plan's).
        A lead waiting for a listed account is not moved off the list and nobody is paged (this plan's).
        No host file is edited here: which account works where is the owner's entry (this plan's).
      not: |-
        No pin of agw workflow calls or of a provider. An OpenCode lead takes no account.
      acceptance: |-
        Tests of pickAccount: an open account outside the list is never picked; all listed closed or full answers window, naming the list and the first opening; no list equals today's result.
        A test of moveWalled: a walled lead moves only to a listed account, else stays.
        A test of admission: two candidates, one with a list, each get an account their project allows.
        make check-fast passes.

  - key: ren-shadow-file-first
    prio: -10
    after: [ren-shadow-settings]
    after_needs: shipped
    seat: { role: lead, moveUp: true }
    title: "The first Issue in a work repo with no host file makes the factory file \"write this project's host file\" before it"
    facts:
      why: |-
        A repo of another organisation is admitted by name (FACTORY_REPO_ALLOW). With no project file it runs on the defaults: ship by push, no rules. In the one team repo without a file, 5 of 7 Issues were cancelled: its rules reached each lead as a hand-written note. A host file carries them once.
      what: |-
        Where an Issue is filed (POST /issues in apps/server/src/api/issues.ts and its app function; apps/server/src/app/planning-pass.ts); apps/server/src/domains/planning/sync.ts (source defaults); apps/server/src/kernel/keys.ts; docs/project.md "A host-local file".
      change: |-
        1. When an Issue is filed for an allowlisted repo whose project is in force from the defaults, the server first files a setup Issue in that repo, once per repo (a deterministic key), and gives the filed Issue an after edge on it.
        2. The setup Issue's facts tell its lead: read the repo (contribution docs, pull request template, CI, the forge's rules on the default branch, recent branch and commit forms); write <projects dir>/<repo>.yaml with work: true, ship by pull request, deploy mode none and rules, without merge and accounts; put rules found only in practice into <projects dir>/<repo>.rules.md and list it; run factory project check <file> --repo <checkout>; close done, no commit.
        3. docs/project.md: the owner or the setup Issue's lead writes a host file; no lead commits one.
      decided: |-
        It refuses nothing: a setup Issue closed without a file releases the edge and the Issue runs on the defaults (this plan's, under the owner's direction of 27 November 2026: nothing is refused).
        The setup lead never writes merge or accounts: the owner's entries; without merge a person approves (this plan's).
        Only allowlisted repos (this plan's).
      not: |-
        Nothing is written into the work repo's tree or posted to its forge.
      acceptance: |-
        A test files two Issues for an allowlisted repo with no file: one setup Issue, both wait after it; a third filing adds none.
        A test: a repo with a host file, and one under a root, get no setup Issue.
        A test closes the setup Issue dropped: the waiting Issue can start.
        make check-fast passes.
