        3. --until more than 24 hours ahead is taken as 24 hours, and the answer carries the sentence: "a wait over a day is dated work: commit a plan row with not_before to docs/plan.yaml with your change (factory plan schema), ship what is built, and say what is still to be counted." Nothing is refused. --after and --review are unchanged, and so are the steward's own waits (twelve hours at most).
      decided: |-
        A day at most for a lead's own timer, taken and not refused. This plan's.
        The reason is optional: no new required field in front of a lead. This plan's.
        signal file gets no date: a lead's dated follow-up is a plan row. This plan's.
      acceptance: |-
        Tests: an Issue filed with not_before tomorrow is not admitted while places are free, its queue reason is of kind date, and it is admitted once the time has come; defer --until 25 hours ahead is applied as 24 hours and its answer holds the plan-row sentence; 23 hours ahead with a reason is applied and issue show prints the reason.
