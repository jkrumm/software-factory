  - key: mat-workflow-failure
    kind: bug
    prio: 10
    title: "A failed or unavailable workflow run is retried, never read as an answer"
    facts:
      why: |-
        Five agw workflows (factory-ask, factory-triage, factory-steward, factory-queue, factory-hygiene) catch a model failure and return a valid neutral answer with a reason that says unavailable. The factory never reads that reason, so its retries (JUDGE_MAX_TRIES, apps/server/src/app/checkpoints-settle.ts about line 241) do not run: an outage pages the owner at once, marks a queue shape as asked for good and settles triage with no edges. The row mat-agw-failures removes the catch in agw once this row has shipped.
      what: |-
        apps/server/src/adapters/agw/*, the callers in apps/server/src/app/checkpoints-settle.ts and apps/server/src/app/loops/{triage,steward,queue,hygiene}.ts, the fake agw of tests/scenarios.
      change: |-
        For those five calls: a run that failed, and (until agw changes) an answer whose reason marks it unavailable, count as a failed try. Each call uses the retry it already has; where a call has none, it leaves the row unclaimed for the next pass. Nothing is recorded as asked, settled or paged on a failed try.
      acceptance: |-
        Scenarios with the fake agw failing and with it answering unavailable: a Decision is not sent to the owner before its tries run out; triage does not settle an Issue with no edges; a queue shape is asked again on the next pass. make check-fast passes.
