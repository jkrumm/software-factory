        After the grant a collect command pushed from the mini returns its output with no dialog.
        make check passes.

  - key: ren-macbook-classes-pending
    prio: 70
    title: "A MacBook command that met a locked screen runs as soon as the MacBook is unlocked, and waiting is never counted as a failed run"
    facts:
      why: |-
        A command pushed to the owner's MacBook can meet a locked screen. It should run when the MacBook is back, with no second Errand. Today that holds only for a MacBook that did not answer at all. One that answered but was locked is no return, so the command waits for the next desk pass: up to six hours, or his next visit to the Console.
      what: |-
        apps/server/src/app/loops/desk.ts and apps/server/src/domains/errands/desk.ts. The desk pass is due when the owner comes back (a Console read after two hours, or the MacBook answering after it did not) and every DESK_EVERY_MS. While the MacBook is known down the loop probes it each tick (desk.ts lines 90-94); a push that exits 69 (PUSH_UNREACHABLE) marks it down. The MacBook's gate answers 75 when a granted class needs an unlocked or active screen, and its verb in-use prints active, idle or locked (dotfiles, scripts/<macbook-alias>-gate.sh). MAX_RUN_TRIES (domains/errands/need.ts) ends an Errand after two unsuccessful runs. Untouched: the first screen, the checks, the dialog.
        <macbook-alias> stands for the MacBook's ssh alias: the gate is the one script matching scripts/*-gate.sh in dotfiles, and its test has the same name with .test.sh.
      change: |-
        1. A push that came back 75 is recorded as waiting for the screen, beside the down mark.
        2. While a command waits for the screen, the loop asks in-use each tick through the push port. A change from locked to active or idle counts as a return: the pending commands go at once.
        3. Neither 69 nor 75 raises runAttempts.
        4. read needs shows the wait on the Errand: waits for the MacBook to be unlocked.
        5. docs/language.md and docs/operations.md where they describe the desk pass.
      decided: |-
        The probe runs outside any transaction and its outcome is recorded after (AGENTS.md).
        One ssh call a tick, only while something waits. This plan's.
        A migration takes its number from bun scripts/merge-guard.ts --next-migration at the last rebase.
      acceptance: |-
        Unit tests of the desk pass: a push answered 75 leaves the Errand open with runAttempts unchanged; a later in-use answer of active makes the pass due and the command is pushed once; two 69 answers do not retire the Errand.
        factory read needs --format json shows the waiting phrase for such an Errand.
        make check-fast passes.

