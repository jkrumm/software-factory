      why: |-
        The factory holds what each judge lacks: the Issue as filed, the owner's notes, the plan, the chain and the history. It sends a title and a few clipped lines.
      what: |-
        apps/server/src/domains/checkpoints/decision.ts (judgeInputOf); app/loops/steward.ts (HISTORY_LINES 12, lines cut to 160) and domains/planning/stall.ts (repeatOf and backoffs are held, not sent); adapters/agw/amend.ts (candidates by title); read/planning-loop-reads.ts (the summary, cut to 600); domains/intake/screen.ts; domains/errands/errand.ts and app/checkpoints-errands.ts (host is macbook or null); the request schemas in packages/contract.
      change: |-
        One builder, caseFile, in read/ (it writes nothing), used by every judgment request: the Issue's filed text and facts, the owner's notes, the repo brief (the project.yaml summary and the head of AGENTS.md, read from the main checkout through the git port), the repo's open Issues with summaries and edges, the plan rows around the Issue, and this judge's earlier answers in the repo, with their outcome once judge-ledger has it. Scrubbed as today. A work repo's case is built and sent to agw (NL22); the read token still sees none of its words (NL18). The Judge's request names the checkout for its tools. The stubs go: the steward gets 40 history lines of 500 characters, repeatOf, backoffs and the lead's last pane lines; triage's candidates come with their summaries; an Errand on the mini carries its host; the queue's summary falls back to the filed text. No port is called inside a transaction. The Judge's back (judge-agw-case): the request allows it on a Decision's first look. The note reaches the lead as its next turn; the Decision stays open and out of Needs you. The lead decides and settles it itself, or asks again, which amends the Decision and gets the second look: answer or owner, never back twice. A gate's Spec gets the same look once before the owner is paged: ready, or back to its lead with what to sharpen; the Judge never gives a gate its verdict.
