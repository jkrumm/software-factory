  - key: ren-finders-one-rule
    not_before: 2026-11-30T07:00:00Z
    prio: -10
    title: "Every finder passes one gate and one ledger rule: a figure, the day it is read again, and a flat reading counts like a drop"
    facts:
      why: |-
        A finder is one kind of finding a loop can file. 40 finders filed 383 Issues in 14 days, 16 % of all Issues (lens F13). The gate (`apps/server/src/domains/improve/finders.ts`) mutes a finder only when leads drop over half of its last ten Issues. Leads close 86 % as done, so a finder that never moves its figure stays open. A new finder starts open; one filed 11 noise Issues in 2.5 hours. Throughput passes no gate. Three rules say what flat is: any fall (`ledger.ts`), 10 % three days after the ship (`throughput.ts`), 5 % (`read/retro.ts`). In the 14 days to 27 November 331 of 405 ledger rows were unmeasured.
      what: |-
        `domains/improve/finders.ts`, `ledger.ts`, `throughput.ts` (`MOVED_SHARE`, `AFTER_DAYS`), `app/loops/gate.ts`, `app/loops/ledger.ts`, the gate's callers in `app/loops/friction.ts`, `hygiene.ts`, `selfwatch.ts` and `throughput.ts`, and the table `factory.loop_findings`.
      change: |-
        1. A finder declares its figure and how many days after the ship it is read again. The ledger judges a finding on that day, not at the next pass. One threshold says flat: 10 %.
        2. Throughput's findings pass the same gate and rule; its private rule goes.
        3. The gate counts a flat or worse verdict like a dropped Issue.
        4. A finder with no closed Issue is on probation: one open Issue at a time.
        5. The third finding of one finder and subject in one repo within 7 days is not filed; the finder is held for that subject, and `factory read finders` shows the hold.
        6. A finder without a figure (hygiene's `judgment`) is flat when the next full pass finds the same key again.
      decided: |-
        All this plan's, from lens F13. A mute lasts 14 days as today. A held or muted finder files nothing and pages nobody.
      not: |-
        Friction's own filing moves to the weekly retro in `ren-finders-one-rule-retro`. A finder and the owner's settings: `ren-finder-leaves-settings`.
      acceptance: |-
        - Unit tests: three flat verdicts among ten count as three drops; a new finder files one Issue and waits; the third finding of one subject in a week is held.
        - `rg -n "MOVED_SHARE|FLAT_WITHIN" apps/server/src` finds one definition.
        - `factory read finders --format json` lists throughput's finders.
        - `make check-fast` passes.
