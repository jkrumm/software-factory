        `make check-fast` passes.

  # Renovation 2026-11, Track E: one model, true words and figures (fix-follow, one reason table, removals, the docs as six pictures).
  - key: ren-fix-follow-read-range
    prio: 80
    title: "A ship records the commits it landed on its base branch, so a later fix can be traced to it"
    facts:
      why: |-
        The renovation's removals are judged by fix-follow: the share of shipped Issues whose lines another Issue's fix changes within 72 hours. That needs a join from a commit on the default branch to the ship that brought it. The join is broken: a ship's evidence holds the commits of the lead's branch, and a squash or rebase merge rewrites them. Until 21 November 93 % of one busy repo's default-branch commits mapped to a ship; since then 14 % do (lens F17, which repaired the join by hand, by position).
      what: |-
        `apps/server/src/domains/quality/evidence.ts` (`CommitsEvidence`: `commits`, `landedAt`, `mergedSha`, `mergedAt`, `base`, `paths`), `domains/quality/ports.ts` (the `Commits` port: `read` and `landed`), its git adapter, `apps/server/src/app/quality-ship.ts` (where the evidence is written, outside any transaction), and `factory.quality_evidence` (kind `commits`; the payload is JSON, so no migration).
      change: |-
        1. The evidence gains the range the change added to its base branch: the commit before it and its last commit there. For a squash that is one commit; for a push without a pull request, the pushed commits.
        2. The port's adapter reads it with git when the ship is checked, where it already reads where the commits landed.
        3. Find out what `mergedSha` holds for a squash merge (the commit on the base branch, or the branch's head) and say so in the Report; if it is the base-branch commit, the range is built from it.
      decided: |-
        - Old evidence is not rewritten; the range is absent there (this plan's).
        - A ship is never refused for a range that cannot be read: the evidence is stored without it and the Report of the read counts such ships apart (this plan's).
      not: |-
        The read, the blame links and the figure are row `ren-fix-follow-read`.
      acceptance: |-
        - A test of the git adapter on a scratch repo: a branch of two commits squashed onto the base gives a range of one commit that is on the base branch.
        - After the deploy, the newest ship's `commits` evidence carries the range (`factory issue quality <id> --format json`), and `git branch --contains` shows its last commit on the base branch.
        - `make check-fast` passes.
  - key: ren-fix-follow-read
    prio: 80
    seat: { role: lead, moveUp: true }
    after: [ren-fix-follow-read-range]
    after_needs: shipped
    title: "factory read fix-follow: the share of shipped Issues whose lines another Issue's fix changed within 72 hours, per repo"
    facts:
      why: |-
        The direction of 27 November: "A removal is judged by fix-follow, not by argument." No figure counts a shipped defect today: first verification read 96.4 % while about one shipped Issue in six drew a fix within a week (lens F17). Baseline: 8.4 %, 39 of 465 Issues shipped from 19 to 23 November were followed by a fix within 72 hours.
      what: |-
        `apps/server/src/app/loops/fix-causes.ts` and `adapters/hygiene/fix-commits.ts` store every project's fix commits in `factory.fix_commits`; no column says what a fix repaired. After row `ren-fix-follow-read-range` a ship's `commits` evidence holds the range it landed on its base branch. First verification is in `apps/server/src/read/kpis.ts`.
      change: |-
        1. The pass that stores fix commits also runs `git blame` on the lines each fix or revert commit changed, and stores one link per fix and blamed commit, with the lines and their share of the fix. A new table, by an expand migration with no CHECK list.
        2. `factory read fix-follow` (route, policy row for the read class, contract model, generated CLI operation): per repo and in all, the ships of the window, those another Issue's fix followed within 72 hours and within 7 days, and the share; split by first seat and by files touched (1 to 2, 3 to 9, 10 or more). A ship without a range is counted apart.
        3. The KPI catalogue gains `fix_follow_72h`: lower is better, the target is at most the baseline. `factory read kpis` carries it like any KPI.
      decided: |-
        This plan's:
        - A link counts at three or more code lines of the ship that are 30 % of the fix (lens F17's strict link). A fix by the same Issue is no follow.
        - Blame runs in that loop pass, outside any transaction, with a process timeout; never in a request or in the leads pass. No model call.
        - The migration takes the next free number `make merge-guard` names at the last rebase, never a number written in a row.
      not: |-
        Removing the fix classes and `read fix-commits` is row `ren-loops-removed-fix-classes`. No check is removed here.
      acceptance: |-
        - `factory read fix-follow --format json` on the mini prints per repo `ships`, `followed72h`, `followed7d` and the share.
        - A scenario test: the second Issue's fix changes three lines of the first, and the read counts one follow.
        - The Report states the 72-hour share for the ships since the range exists, beside the baseline of 8.4 %, and names what explains a gap over two points.
        - `factory read kpis --format json` lists `fix_follow_72h`, and `make check-fast` passes.
  - key: ren-reason-table
    not_before: 2026-11-30T07:00:00Z
    prio: -10
    seat: { role: lead, moveUp: true }
    title: "One typed table says why an Issue waits: three counts, a reason for each, no fallback"
    facts:
      why: |-
        Screens show five words through three maps typed `Record<string, …>` with a fallback, so a kind without an entry compiles and lands under a wrong word: `tests` (274 Issues in the week to 26 November) and `disk` read "room in the allowance", `cap` "the repo", `doctor` "the host", a pull request waiting for a person's review "on another Issue". The owner's switch held 53 % of queued hours and no surface calls it his.
      what: |-
        `packages/contract/src/work-words.ts` (`workOf`, its three maps); `QUEUE_REASONS` in `packages/contract/src/capacity.ts`; `WAITS` in `apps/server/src/domains/work/issue.ts`; the server's word maps in `apps/server/src/read/describe.ts` and `read/throughput-answers.ts` (8 of 16 kinds, then the raw key). The counts in the reads, the Console and the two clients are other rows.
      change: |-
        1. The wait kinds move into the contract; `WAITS` is typed against them.
        2. One table in the contract, read through `reasonOf`, maps every stored kind (the state `settling`, the queue reasons and none, the waits) to its count, its reason word and who ends it: you, a machine, a clock, another person. A `Record` over the kinds with no default: a new kind fails `tsc` until it has a row.
        3. The counts are Not started (`settling`, `queued`), In work (`working`, `waiting`; it always shows its running share) and Checking (`watching`).
        4. `describe.ts` and `throughput-answers.ts` take their words from the table. `workOf` keeps answering the five words, from the table.
      decided: |-
        This plan's. The counts are those of the picture confirmed on 26 November.
        - Not started: your switch (`drain`) · on another Issue (`chain`) · red line (`line`) · cannot run here (`settling`, `finalizing`, `unknown_project`, `doctor`) · the host (`load`, `memory`, `boot`, `disk`, `tests`) · the repo (`claim`, `lane`) · the accounts (`window`, no reason).
        - In work: running (`working`) · on a timer (`timer`) · on you (`decision`, `review`, `errand`, `paused`) · on another Issue (`dependency`) · on a reviewer (`external`) · stalled (`wall`, `unreported`, `blocked`, `lead_gone`, `regressed`).
        - A kind another row removes gets a row marked history, so the type is total whichever lands first: `spec` (on you), `cap` (the accounts).
        - A kind another row adds gets its word in that row: `date` reads "not before a date" and a clock ends it; `aim` reads "the host".
        - No exception in `vocabulary.ts`: no count label is a stored state word.
      not: |-
        No kind for a project set to pace: `ren-admission-dead-gates-pace` removes that state. Who set a switch: `ren-switch-remembers`.
      acceptance: |-
        - A contract test fails when an open state, queue reason or wait has no row in the table.
        - `rg -n "Record<string" packages/contract/src/work-words.ts` finds nothing.
        - `factory issue show` of an Issue in a draining project says "your switch"; one that waits for the test line says "the host".
        - `bun scripts/vocabulary.ts` and `make check-fast` pass.
