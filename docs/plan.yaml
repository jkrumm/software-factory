  - key: ren-alerts-keep-state-quiet
    prio: 40
    after: [ren-alerts-keep-state]
    after_needs: shipped
    title: "An alert whose Issue closed without a change stays quiet for a day instead of opening the next Issue"
    facts:
      why: |-
        A lead that finds an alert is a known baseline or no code defect can only close its Issue; the next firing opens a new one. One disk alert opened nine Issues in five days and none shipped. On 24 November 2026 another host's outage opened four Issues in one repo in 45 minutes (lens F07).
      what: |-
        apps/server/src/app/intake-alerts.ts, downIn after "latest subject" (lines 185-205): an alert that never reported up since its last Issue was filed counts as still firing and files anew, whatever that Issue found (stillFiring). The subject row (intake_subjects) holds the last Issue, upAt and repeats. An Issue's outcome and whether it shipped are in issue_events.
      change: |-
        1. When an alert's Issue closes dropped, or done without a ship, its subject is acknowledged for 24 hours from the close.
        2. A firing of an acknowledged subject files nothing: it raises the count and is stored as joined to the closed Issue.
        3. The quiet ends early when the subject reports up and fires again, and at once when the alert's status is worse than the one acknowledged.
        4. After 24 hours a subject still red files one Issue whose facts carry the count and the closing note of the Issue before.
