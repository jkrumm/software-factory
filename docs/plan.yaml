      what: |-
        `read/kpis.ts` (`cycleTimes` and the figure `cycle_p50`), `read/kpis-flow.ts` (`cycleBeside`), `read/kpis-seats.ts` and `read/seats.ts` (the cost per seat: call it, do not copy it), and the definitions in `packages/contract/src/kpi-catalog.ts`.
