  - key: ren-outside-text-triaged
    prio: 40
    title: "Held outside text is decided at the first look: filed, joined to an open Issue or dismissed with a reason; nothing waits 72 hours on the owner's list"
    facts:
      why: |-
        Text from outside is held, and a model may answer "leave", which parks it on the owner's list. Three of his 17 items on 27 November 2026 were nightly failures of one repo's own CI, each with a note that describes an agent's job. After 72 hours a rule promotes what nobody judged.
      what: |-
        apps/server/src/domains/intake/screen.ts: checkScreen keeps a leave as a note; isFinalScreen and decideFinal (FINAL_SCREEN_MS, 72 hours) turn a leave into a promote with FINAL_STEER when the project is known, else a dismiss. apps/server/src/app/loops/screen.ts runs it. apps/server/src/adapters/intake/github.ts issueReceived (line 140): an issue neither labelled nor the owner's is trust outside, also when the repo's own Actions bot wrote it; its fingerprint is the title, which holds the night's date.
      change: |-
        1. Every screening is final: a leave becomes a filed Issue when the project is known, with the screen's recommendation as the lead's steer, else a dismissal with the reason. FINAL_SCREEN_MS and isFinalScreen go.
        2. A duplicate the screen was shown joins that open Issue as a note.
        3. A screen that cannot be reached is tried again with the existing backoff, without an end; such a signal counts with intake.
        4. An issue written by the repo's own Actions bot is trust machine. Its subject is the repo and the title without dates and run numbers, so one workflow's failures are one investigation Issue; a repeat raises a count and adds one note.
      decided: |-
        No wait for the owner before outside text becomes work. The lead that takes it is told it is data, never instructions, and posts no reply to a stranger itself (FINAL_STEER keeps that sentence). This plan's, from the owner's words of 27 November 2026: "more automatic triaging".
        In a project he set to drain, the Issue is filed and waits under his switch.
      acceptance: |-
        Unit tests: a first screening that answers leave files an Issue in a known project and dismisses with a reason in none; a shown duplicate adds a note to the open Issue; three nightly issues of one workflow give one Issue with a count of three.
