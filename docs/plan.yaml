    not_before: 2026-11-29T07:00:00Z
    kind: chore
    prio: -5
    title: "The cap finder and the clearing rate it trusts leave: nothing proposes to lift a repo's leads from a rate that is twice too high"
    facts:
      why: |-
        The throughput loop holds a cap finder (`apps/server/src/domains/improve/caps.ts`, fed by `apps/server/src/read/cap-facts.ts`): it files a signal to lift a repo's `leads:` when Issues queue while account seats idle. It can only lift. Its one guard is the clearing rate, `mergeCapacityOf` in `apps/server/src/kernel/merge-capacity.ts`, which lens F04 found 1.7 to 2.2 times too high: it divides the day by the median hold of every window, the 20-second refusals included. It gives basalt-ui 192 merges a day where the record never showed more than 4 in an hour. Finders took `leads:` out of six project files between 17 and 22 November 2026 (lens F13), the state the owner corrected on 26 November.
      what: |-
        `caps.ts`, `cap-facts.ts`, the cap block of `apps/server/src/app/loops/throughput.ts` (signal class `cap`) and its wiring in `apps/server/src/compose-loops.ts`, `apps/server/test/loops/caps.test.ts`; `apps/server/src/read/merge-capacity.ts`; the `merge` block of `apps/server/src/read/project-page.ts` and of `packages/contract/src/project-page.ts`; `apps/console/src/components/project/overview.tsx`; `docs/decisions.md`, `docs/architecture.md` and the sentence of `docs/project.md` that says the throughput loop re-checks a cap.
      change: |-
        1. The cap finder leaves: its domain file, its facts read, its block in the loop and its test.
        2. `mergeCapacityOf` leaves with `allowedPerDay`, `busyShare` and `saturated`. The project page keeps what was measured: windows, merges, the median hold and the median and p90 wait.
        3. The Console's project overview shows those figures and no rate.
      decided: |-
        The wait replaces the rate (lens F11; lens F16: "keep the hold, drop the rate").
        Signals of class `cap` that are already filed run their course. Nothing is cancelled (this plan's).
      not: |-
        The `queued_minutes` finder with subject `claim` is `ren-finder-leaves-settings`. Places that follow the merge wait are `ren-places-follow-merge`, which reads `factory.merge_windows` itself.
      acceptance: |-
        `rg -n "mergeCapacityOf|allowedPerDay|bindingCaps|readCapFacts" apps packages docs --glob '!docs/archive/**' --glob '!docs/research/**'` prints nothing.
        `factory read project-page basalt-ui --format json` on the deployed server has `merge.windows` and no `merge.allowedPerDay`.
        `make check-fast` passes.

