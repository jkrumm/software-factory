  - key: ren-secrets-service-account
    repo: dotfiles
    prio: 80
    title: "The mini holds a 1Password service account for its own vaults, created once by the owner and kept inside the secret cache"
    facts:
      why: |-
        In the 14 days to 27 November 2026 about 35 Errands asked the owner to reseal the mini's secret cache or to create a 1Password item (the factory's errands table, classed by summary). The owner: "the one password prompt should then over time not be needed anymore".
      what: |-
        The mini reads secrets only from one SOPS+age cache (scripts/secrets-run); op hangs there on a biometric prompt. The ref lists and the cache are in the private data repo: a personal list (126 refs in five vaults) and one for the work organisation's account. make secrets-seed-new seals new refs on the MacBook and sends the cache to the mini. The mini's op is 2.13.1; a service account needs 2.18.0 or later. No service account exists.
      change: |-
        1. op on the mini at 2.18.0 or later, through the repo's brew path.
        2. A script and a make target secrets-service-account for the MacBook: op service-account create with --vault <vault>:read_items,write_items for each vault of the personal list (names read from the list at run time, never written into a tracked file). It saves the token, which is printed once, as an item in one of those vaults, adds its ref to the list and runs the incremental seal.
        3. A check on the mini, part of make doctor: op user get --me under the token prints the type SERVICE_ACCOUNT.
      decided: |-
        Only the personal list's vaults. Never the work organisation's account; the built-in Private vault cannot be granted. This plan's proposal: the owner consents by running the Errand, and turning it back ends this row and the three that wait for it.
        Vault access cannot be changed after creation: a new vault means the target run again.
        The token rests only inside the encrypted cache; no expiry. This plan's.
      acceptance: |-
        op --version on the mini prints 2.18.0 or later.
        The lead raised one Errand (factory errand raise, --need secret, --host macbook) whose command runs make secrets-service-account in the form docs/tcc.md gives for a biometric command, with a check; it closed.
        The doctor check passes on the mini.
        make check passes.

