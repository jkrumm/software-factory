# copied from hermes-agent/project.yaml on 2026-11-17, comments dropped
apiVersion: factory/v2
name: hermes-agent
deploy:
  mode: make
  targets:
    - name: mini
      host: mini
      verify: make verify
  hold: 5m
  migrations: []
ship:
  - paths:
      - '**'
    via: push
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z
leads: 1
hygiene:
  probes:
    - name: upstream
      target: upstream-check
    - name: live
      target: verify
