name: ci

on:
  push:
    branches: [master, rewrite]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Public repo: hosted runners. The tests start their own throwaway Postgres from the PostgreSQL packages that
    # ship on the runner image (tests/support/pg.ts finds /usr/lib/postgresql/<major>/bin); shellcheck ships there too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Install first: bunx outside node_modules fetches the latest Playwright, whose browser revision is not the one
      # the lockfile's @playwright/test launches. --with-deps needs apt; when the runner's mirror is down (2026-11-11:
      # 'Temporary failure resolving azure.archive.ubuntu.com' for over an hour) the browser alone still installs and the
      # runner image already carries Chromium's libraries, so a real gap shows up as a red e2e run, not a stuck install.
      # The apt attempt is bounded: apt's own retries took ~20 min to give up, the fallback needs seconds.
      - run: bun install --frozen-lockfile && (timeout 180 bunx playwright install --with-deps chromium || bunx playwright install chromium)
      - run: make check
