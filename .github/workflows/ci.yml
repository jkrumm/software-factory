name: ci

on:
  push:
    branches: [master, rewrite]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The full gate (`make check`) split across hosted runners. Public repo: hosted runners, never the self-hosted one.
# `merge-guard` reads this workflow's run, which is green only when every job below is, so the split changes nothing
# for it. The tests start their own throwaway Postgres from the PostgreSQL packages that ship on the runner image
# (tests/support/pg.ts finds /usr/lib/postgresql/<major>/bin); shellcheck ships there too.
#
# One matrix, fail-fast: the first job that goes red cancels the ones still queued or running, and the run ends
# `failure`. (A red `static` is known minutes before the test jobs end. `gh run cancel` from a step does the same but
# ends the run `cancelled`, which merge-guard and the selfwatch `ci_red` read as superseded, so a red head or master
# would not show as red.) Job names are the matrix entries' `name`.
jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          # What a lead runs locally (project.yaml `checks.fast`): format, lint, types, boundaries, scans, every unit test.
          # The unit tests are half of it (203 s of a 234 s job): `static` runs the first of two shards beside the checks.
          - { name: static, make: check-fast CHECK_FAST_ALL=1 UNIT_SHARD=1/2 }
          - { name: unit (2/2), make: test-unit UNIT_SHARD=2/2 }
          # bun cuts the files by count, not time: with three shards one of them ran 265 s against 167 and 191.
          - { name: scenarios (1/4), make: test-scenarios SHARD=1/4 }
          - { name: scenarios (2/4), make: test-scenarios SHARD=2/4 }
          - { name: scenarios (3/4), make: test-scenarios SHARD=3/4 }
          - { name: scenarios (4/4), make: test-scenarios SHARD=4/4 }
          # The files of a shard are planned by seconds (scripts/e2e-shard.ts, tests/e2e/shard-weights.json).
          - { name: e2e (1/3), make: e2e E2E_SHARD=1/3, playwright: 'true' }
          - { name: e2e (2/3), make: e2e E2E_SHARD=2/3, playwright: 'true' }
          - { name: e2e (3/3), make: e2e E2E_SHARD=3/3, playwright: 'true' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          playwright: ${{ matrix.playwright || 'false' }}
      - run: make ${{ matrix.make }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.playwright == 'true'
        with:
          name: e2e-results-${{ strategy.job-index }}
          path: tests/e2e/out
          if-no-files-found: ignore
          retention-days: 3
