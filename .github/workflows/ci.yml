name: ci

on:
  push:
    branches: [master, rewrite]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The full gate (`make check`) split across hosted runners. Public repo: hosted runners, never the self-hosted one.
# `merge-guard` reads this workflow's run, which is green only when every job below is, so the split changes nothing
# for it. The tests start their own throwaway Postgres from the PostgreSQL packages that ship on the runner image
# (tests/support/pg.ts finds /usr/lib/postgresql/<major>/bin); shellcheck ships there too.
jobs:
  # What a lead runs locally (project.yaml `checks.fast`): format, lint, types, boundaries, scans, every unit test.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make check-fast
        env:
          CHECK_FAST_ALL: '1'

  scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make test-scenarios
        env:
          SHARD: ${{ matrix.shard }}

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: make e2e
        env:
          E2E_SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results-${{ strategy.job-index }}
          path: tests/e2e/out
          if-no-files-found: ignore
          retention-days: 3
