name: setup
description: Bun, the install (cached by the lockfile) and, when asked, Playwright's Chromium (cached by the lockfile too)

inputs:
  playwright:
    description: Install Chromium for the Console suite
    default: 'false'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - run: bun install --frozen-lockfile
      shell: bash
    # Install first: bunx outside node_modules fetches the latest Playwright, whose browser revision is not the one
    # the lockfile's @playwright/test launches. --with-deps needs apt; when the runner's mirror is down (2026-11-11:
    # 'Temporary failure resolving azure.archive.ubuntu.com' for over an hour) the browser alone still installs and the
    # runner image already carries Chromium's libraries, so a real gap shows up as a red e2e run, not a stuck install.
    # The apt attempt is bounded: apt's own retries took ~20 min to give up, the fallback needs seconds.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.playwright == 'true'
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    - run: timeout 180 bunx playwright install --with-deps chromium || bunx playwright install chromium
      if: inputs.playwright == 'true'
      shell: bash
